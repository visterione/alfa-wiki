<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#007AFF" />
  <meta name="description" content="Alfa Wiki - База знаний медицинского центра" />
  
  <!-- Favicon - PNG версии -->
  <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png" />
  <!-- Для Apple устройств -->
  <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />

  <!-- Univer styles will be loaded via imports in React components -->

  <title>Альфа Вики</title>

  <!-- Тема применяется до загрузки бандла: React монтируется через сотни
       миллисекунд, и всё это время тёмная тема была бы белой вспышкой.
       Значение берём из того же кэша, что и AppearanceContext.

       Настройку системы не спрашиваем: тёмная включается только явным выбором,
       иначе портал сменил бы вид у половины сотрудников сам по себе. -->
  <script>
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem('appearance-v1') || '{}');
        document.documentElement.dataset.theme = saved.theme === 'dark' ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>

  <style>
    /* Initial loading styles to prevent white flash */
    body {
      margin: 0;
      background: linear-gradient(135deg, #0a3d62 0%, #1e3799 50%, #4a148c 100%);
      min-height: 100vh;
    }

    #root {
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <noscript>Для работы приложения необходим JavaScript.</noscript>
  <div id="root"></div>
</body>
</html>
