<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Хирургический стационар</title>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --sur-primary: #2563eb;
  --sur-primary-hover: #1d4ed8;
  --sur-bg: #f8fafc;
  --sur-card: #fff;
  --sur-border: #e5e7eb;
  --sur-border-dark: #cbd5e1;
  --sur-text: #111827;
  --sur-muted: #64748b;
  --sur-success: #16a34a;
  --sur-danger: #dc2626;
  --sur-warning: #d97706;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--sur-bg);
  color: var(--sur-text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 14px;
}
button, input, textarea, select { font-family: inherit; }
#surgery-app { width: 100%; max-width: none; margin: 0; padding: 10px 14px 14px; }
.sur-topbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 6px; margin-bottom: 10px; border-bottom: 1px solid var(--sur-border);
  padding-bottom: 8px; flex-wrap: wrap;
}
.sur-topbar-title { font-size: 15px; font-weight: 700; color: var(--sur-primary); }
.sur-actions { display: flex; gap: 5px; flex-shrink: 0; }
.sur-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 34px; padding: 7px 12px; border: 1px solid transparent; border-radius: 7px;
  font-size: 13px; font-weight: 600; cursor: pointer; transition: background .15s, border-color .15s, color .15s;
  white-space: nowrap;
}
.sur-btn-primary { background: var(--sur-primary); color: #fff; }
.sur-btn-primary:hover { background: var(--sur-primary-hover); }
.sur-btn-secondary { background: #fff; color: #334155; border-color: var(--sur-border-dark); }
.sur-btn-secondary:hover { background: #f1f5f9; }
.sur-btn-danger { background: #fee2e2; color: var(--sur-danger); }
.sur-btn-danger:hover { background: #fecaca; }
.sur-btn-success { background: var(--sur-success); color: #fff; }
.sur-btn-success:hover { background: #15803d; }
.sur-btn-icon { width: 34px; min-height: 34px; padding: 0; }
.sur-btn svg { width: 16px; height: 16px; }
.sur-layout { display: grid; grid-template-columns: 1fr; gap: 12px; align-items: start; }
.sur-panel {
  background: var(--sur-card); border: 1px solid var(--sur-border); border-radius: 10px;
  overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.05);
}
.sur-panel-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 14px; border-bottom: 1px solid var(--sur-border);
  background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 100%);
  border-left: 3px solid var(--sur-primary);
}
.sur-panel-title { margin: 0; font-size: 13px; font-weight: 700; color: var(--sur-primary); letter-spacing: -.01em; }
.sur-form { padding: 13px; }
.sur-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.sur-field { display: flex; flex-direction: column; gap: 3px; margin-bottom: 0; min-width: 0; }
.sur-field.span2 { grid-column: span 2; }
.sur-field.full { grid-column: 1 / -1; }
@media (max-width: 560px) {
  .sur-field.span2 { grid-column: 1 / -1; }
}
.sur-field label {
  font-size: 10px; font-weight: 700; color: #94a3b8;
  text-transform: uppercase; letter-spacing: .06em;
}
.sur-required { color: var(--sur-danger); }
.sur-input, .sur-select, .sur-textarea {
  width: 100%; border: 1px solid var(--sur-border-dark); border-radius: 7px; background: #fff;
  color: var(--sur-text); padding: 6px 9px; min-height: 32px; outline: none; font-size: 13px;
  transition: border-color .15s, box-shadow .15s;
}
.sur-textarea { min-height: 40px; resize: vertical; line-height: 1.35; }
.sur-input:focus, .sur-select:focus, .sur-textarea:focus {
  border-color: var(--sur-primary); box-shadow: 0 0 0 3px rgba(37,99,235,.1);
}
.sur-form-actions {
  display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px;
  padding-top: 10px; border-top: 1px solid var(--sur-border);
}
.sur-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 13px; border-bottom: 1px solid var(--sur-border); flex-wrap: wrap; }
.sur-filters { display: flex; gap: 7px; flex-wrap: wrap; flex: 1; min-width: 0; }
.sur-search { min-width: 130px; flex: 1; }
.sur-table-wrap { overflow: auto; max-height: calc(100vh - 260px); min-height: 120px; }
.sur-table { width: 100%; border-collapse: collapse; font-size: 11px; }
.sur-table th {
  position: sticky; top: 0; z-index: 1; background: #f8fafc; color: #334155; text-align: left;
  padding: 5px 7px; border-bottom: 1px solid var(--sur-border); font-weight: 700; white-space: nowrap;
}
.sur-table td { padding: 4px 7px; border-bottom: 1px solid var(--sur-border); vertical-align: top; }
.sur-table tr:hover td { background: #f8fafc; }
.sur-table .center { text-align: center; }
.sur-actions-cell { display: flex; gap: 5px; justify-content: center; }
.sur-table th.col-actions,
.sur-table td.col-actions { position: sticky; right: 0; box-shadow: -2px 0 5px rgba(0,0,0,.07); }
.sur-table th.col-actions { z-index: 3; }
.sur-table td.col-actions { background: #fff; z-index: 2; }
.sur-table tr:hover td.col-actions { background: #f8fafc; }
.sur-empty { text-align: center; color: var(--sur-muted); padding: 28px 12px !important; }
.sur-status { display: inline-flex; align-items: center; gap: 5px; color: var(--sur-muted); font-size: 12px; }
.sur-status.error { color: var(--sur-danger); }
.sur-status.loading { color: var(--sur-primary); }
.sur-pagination {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 8px 13px; border-top: 1px solid var(--sur-border); background: #f8fafc; flex-wrap: wrap;
}
.sur-pagination-controls { display: flex; align-items: center; gap: 6px; }
.sur-page-size { width: 80px; }
.sur-toast {
  position: fixed; right: 16px; bottom: 16px; z-index: 1000; padding: 10px 13px;
  border-radius: 8px; background: #111827; color: #fff; box-shadow: 0 10px 30px rgba(15,23,42,.2);
  font-size: 13px; font-weight: 600;
}
.sur-toast.success { background: var(--sur-success); }
.sur-toast.error { background: var(--sur-danger); }
@media (max-width: 640px) {
  #surgery-app { padding: 8px 10px 12px; }
  .sur-actions { justify-content: flex-start; width: 100%; }
  .sur-search { min-width: 100%; }
  .sur-table-wrap { max-height: none; }
  .sur-form { padding: 11px; }
}
</style>
</head>
<body>
<div id="surgery-app">
  <div class="sur-topbar">
    <span class="sur-topbar-title">Хирургический стационар</span>
    <div class="sur-actions">
      <button class="sur-btn sur-btn-secondary sur-btn-icon" onclick="surApp.reload()" title="Обновить" aria-label="Обновить">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12a8 8 0 10-2.34 5.66M20 12v6h-6"/></svg>
      </button>
      <button id="sur-btn-import" class="sur-btn sur-btn-secondary sur-btn-icon" onclick="surApp.openImport()" title="Импорт Excel" aria-label="Импорт Excel" style="display:none">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v3h16v-3"/></svg>
      </button>
      <button class="sur-btn sur-btn-success sur-btn-icon" onclick="surApp.exportExcel()" title="Скачать Excel" aria-label="Скачать Excel">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v12m0 0l4-4m-4 4l-4-4M4 17v3h16v-3"/></svg>
      </button>
      <button id="sur-btn-delete-all" class="sur-btn sur-btn-danger sur-btn-icon" onclick="surApp.clearAllData()" title="Удалить все данные" aria-label="Удалить все данные" style="display:none">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7h16M10 11v6m4-6v6M6 7l1 14h10l1-14M9 7V4h6v3"/></svg>
      </button>
      <input type="file" id="sur-import-file" accept=".xlsx,.xls" style="display:none" onchange="surApp.importExcel(this.files[0])">
    </div>
  </div>

  <div class="sur-layout">
    <section class="sur-panel">
      <div class="sur-panel-head">
        <h2 class="sur-panel-title" id="sur-form-title">Новая запись</h2>
        <span class="sur-status" id="sur-storage-status"></span>
      </div>
      <form class="sur-form" id="sur-form" onsubmit="surApp.save(event)"></form>
    </section>

    <section class="sur-panel">
      <div class="sur-toolbar">
        <div class="sur-filters">
          <input class="sur-input sur-search" id="sur-search" placeholder="Поиск по таблице" oninput="surApp.onSearchChange()">
        </div>
        <button class="sur-btn sur-btn-secondary" onclick="surApp.clearFilters()" type="button">Сбросить</button>
      </div>
      <div class="sur-table-wrap">
        <table class="sur-table">
          <thead id="sur-table-head"></thead>
          <tbody id="sur-table-body"></tbody>
        </table>
      </div>
      <div class="sur-pagination">
        <div class="sur-status" id="sur-page-info">0 записей</div>
        <div class="sur-pagination-controls">
          <button class="sur-btn sur-btn-secondary sur-btn-icon" type="button" onclick="surApp.prevPage()" title="Назад">‹</button>
          <select class="sur-select sur-page-size" id="sur-page-size" onchange="surApp.changePageSize(this.value)">
            <option value="50">50</option>
            <option value="100">100</option>
            <option value="200">200</option>
          </select>
          <button class="sur-btn sur-btn-secondary sur-btn-icon" type="button" onclick="surApp.nextPage()" title="Вперёд">›</button>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
window.surApp = (function() {
  var API_URL = (window.location.port === '9000' ? window.location.protocol + '//' + window.location.hostname + ':9001' : window.location.origin) + '/api/surgery-reports';
  var records = [];
  var editingId = '';
  var pagination = { page: 1, pageSize: 50, total: 0 };
  var searchTimer = null;

  var FIELDS = [
    { name: 'reportDate',    label: 'Дата', type: 'date' },
    { name: 'stayPeriod',    label: 'Период пребывания пациента', formLabel: 'Период пребывания', type: 'text', span: 2 },
    { name: 'patientName',   label: 'ФИО пациента', type: 'text', required: true, span: 2 },
    { name: 'phone',         label: 'Телефон', type: 'tel' },
    { name: 'diagnosis',     label: 'Диагноз', type: 'textarea', span: 2 },
    { name: 'remarks',       label: 'Замечания, особенности', type: 'textarea', span: 2 },
    { name: 'referrals',     label: 'Направления', type: 'textarea', span: 2 },
    { name: 'doctorName',    label: 'ФИО врача', type: 'text', span: 2 },
    { name: 'examinations',  label: 'Обследования', type: 'textarea', span: 2 },
    { name: 'registrarMark', label: 'Регистратура отметка о записи', type: 'text', span: 2 }
  ];

  function getToken() {
    return localStorage.getItem('token') || sessionStorage.getItem('token') || '';
  }

  // ID wiki-страницы, в которую встроена таблица. Нужен, чтобы изменения фиксировались
  // в «Журнале изменений» этой страницы. Определяем сами по slug из URL (не зависим от React).
  var PAGES_URL = API_URL.replace(/\/surgery-reports\/?$/, '/pages');
  var wikiPageIdCache = '';

  function wikiPageId() {
    return wikiPageIdCache || (window.__WIKI_PAGE__ && window.__WIKI_PAGE__.id) || '';
  }

  function currentSlug() {
    var parts = window.location.pathname.split('/').filter(Boolean);
    if (!parts.length) return '';
    try { return decodeURIComponent(parts[parts.length - 1]); }
    catch (e) { return parts[parts.length - 1]; }
  }

  // Разрешаем pageId по slug через API страниц и кэшируем — вызывается один раз при инициализации.
  function resolveWikiPageId() {
    if (wikiPageId()) return Promise.resolve(wikiPageId());
    var slug = currentSlug();
    if (!slug) return Promise.resolve('');
    return fetch(PAGES_URL + '/' + encodeURIComponent(slug), {
      headers: { 'Authorization': 'Bearer ' + getToken() }
    }).then(function(r) {
      return r.ok ? r.json() : null;
    }).then(function(page) {
      wikiPageIdCache = (page && page.id) || '';
      return wikiPageIdCache;
    }).catch(function() { return ''; });
  }

  function withPageId(path) {
    var id = wikiPageId();
    if (!id) return path;
    return path + (path.indexOf('?') === -1 ? '?' : '&') + 'pageId=' + encodeURIComponent(id);
  }

  function api(path, options) {
    options = options || {};
    var controller = window.AbortController ? new AbortController() : null;
    var timeout = setTimeout(function() { if (controller) controller.abort(); }, options.timeout || 12000);
    return fetch(API_URL + path, {
      method: options.method || 'GET',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() },
      body: options.body,
      signal: controller ? controller.signal : undefined
    }).then(function(r) {
      clearTimeout(timeout);
      if (!r.ok) return r.text().then(function(txt) {
        var msg = 'Ошибка ' + r.status;
        try { var j = JSON.parse(txt); msg = j.error || j.message || msg; } catch(x) { if (txt && txt.length < 200) msg = txt || msg; }
        throw new Error(msg);
      });
      return r.json();
    }).catch(function(e) {
      clearTimeout(timeout);
      if (e.name === 'AbortError') throw new Error('Сервер не ответил за 12 секунд');
      throw e;
    });
  }

  function uploadApi(path, formData, options) {
    options = options || {};
    var controller = window.AbortController ? new AbortController() : null;
    var timeout = setTimeout(function() { if (controller) controller.abort(); }, options.timeout || 120000);
    return fetch(API_URL + path, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + getToken() },
      body: formData,
      signal: controller ? controller.signal : undefined
    }).then(function(r) {
      clearTimeout(timeout);
      if (!r.ok) return r.text().then(function(txt) {
        var msg = 'Ошибка ' + r.status;
        try { var j = JSON.parse(txt); msg = j.error || j.message || msg; } catch(x) { if (txt && txt.length < 200) msg = txt || msg; }
        throw new Error(msg);
      });
      return r.json();
    }).catch(function(e) {
      clearTimeout(timeout);
      if (e.name === 'AbortError') throw new Error('Импорт не ответил за 120 секунд');
      throw e;
    });
  }

  function today() { return new Date().toISOString().slice(0, 10); }

  function todayDMY() {
    var d = new Date();
    return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + d.getFullYear();
  }

  function focusNextInput(el) {
    var inputs = Array.from(document.querySelectorAll('#sur-form input.sur-input, #sur-form select.sur-select, #sur-form textarea.sur-textarea'));
    var idx = inputs.indexOf(el);
    if (idx >= 0 && idx < inputs.length - 1) inputs[idx + 1].focus();
  }

  function attachDateMask(el) {
    el.addEventListener('keydown', function(e) {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (['Tab','Backspace','Delete','ArrowLeft','ArrowRight','Home','End'].includes(e.key)) return;
      if (!/^\d$/.test(e.key)) e.preventDefault();
    });
    el.addEventListener('input', function() {
      var caretBefore = this.selectionStart;
      var digitsBefore = (this.value.substring(0, caretBefore).match(/\d/g) || []).length;
      var digits = this.value.replace(/\D/g,'').substring(0, 8);
      var f = digits.length > 4
        ? digits.slice(0,2) + '.' + digits.slice(2,4) + '.' + digits.slice(4)
        : digits.length > 2 ? digits.slice(0,2) + '.' + digits.slice(2) : digits;
      this.value = f;
      var n = 0, c = 0;
      while (n < f.length && c < digitsBefore) { if (/\d/.test(f[n])) c++; n++; }
      this.setSelectionRange(n, n);
      if (digits.length >= 8) focusNextInput(this);
    });
  }

  function attachMasks() {
    document.querySelectorAll('#sur-form [data-mask="date"]').forEach(attachDateMask);
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  }

  function formatValue(value) {
    return value == null || value === '' ? '-' : escapeHtml(value);
  }

  function showToast(message, type) {
    var el = document.createElement('div');
    el.className = 'sur-toast' + (type ? ' ' + type : '');
    el.textContent = message;
    document.body.appendChild(el);
    setTimeout(function() { el.remove(); }, 2600);
  }

  function setStatus(text, type) {
    var el = document.getElementById('sur-storage-status');
    el.className = 'sur-status ' + (type || '');
    el.textContent = text;
  }

  function renderForm(data) {
    data = data || {};
    var rows = FIELDS.map(function(field) {
      var value = data[field.name] || '';
      var required = field.required ? ' required' : '';
      var cls = 'sur-field' + (field.full ? ' full' : field.span === 2 ? ' span2' : '');
      var label = '<label for="sur-' + field.name + '">' + escapeHtml(field.formLabel || field.label) +
        (field.required ? ' <span class="sur-required">*</span>' : '') + '</label>';
      var input = '';
      if (field.type === 'textarea') {
        input = '<textarea class="sur-textarea" id="sur-' + field.name + '" name="' + field.name + '"' + required + '>' + escapeHtml(value) + '</textarea>';
      } else {
        var inputType = field.type;
        var extraAttr = '';
        if (field.type === 'date') {
          inputType = 'text';
          extraAttr = ' data-mask="date" placeholder="ДД.ММ.ГГГГ" maxlength="10" autocomplete="off"';
        }
        input = '<input class="sur-input" id="sur-' + field.name + '" name="' + field.name + '" type="' + inputType + '" value="' + escapeHtml(value) + '"' + required + extraAttr + '>';
      }
      return '<div class="' + cls + '">' + label + input + '</div>';
    }).join('');

    document.getElementById('sur-form-title').textContent = editingId ? 'Редактировать' : 'Новая запись';
    document.getElementById('sur-form').innerHTML =
      '<div class="sur-grid">' + rows + '</div>' +
      '<div class="sur-form-actions">' +
        '<button class="sur-btn sur-btn-primary" type="submit">' + (editingId ? 'Сохранить изменения' : 'Добавить запись') + '</button>' +
        '<button class="sur-btn sur-btn-secondary" type="button" onclick="surApp.resetForm()">Очистить</button>' +
      '</div>';

    attachMasks();
  }

  function collectForm() {
    var form = document.getElementById('sur-form');
    var data = {};
    FIELDS.forEach(function(field) {
      var el = form.elements[field.name];
      data[field.name] = el ? el.value.trim() : '';
    });
    return data;
  }

  function resetForm() {
    editingId = '';
    renderForm();
  }

  function renderTable() {
    var head = document.getElementById('sur-table-head');
    head.innerHTML = '<tr>' +
      FIELDS.map(function(f) { return '<th>' + escapeHtml(f.label) + '</th>'; }).join('') +
      '<th class="center col-actions">Действия</th></tr>';

    var tbody = document.getElementById('sur-table-body');
    if (!records.length) {
      tbody.innerHTML = '<tr><td class="sur-empty" colspan="' + (FIELDS.length + 1) + '">Нет данных</td></tr>';
      renderPagination();
      return;
    }
    tbody.innerHTML = records.map(function(row) {
      var d = row.data || {};
      return '<tr>' +
        FIELDS.map(function(f) { return '<td>' + formatValue(d[f.name]) + '</td>'; }).join('') +
        '<td class="center col-actions"><div class="sur-actions-cell">' +
          '<button class="sur-btn sur-btn-secondary sur-btn-icon" type="button" onclick="surApp.edit(\'' + escapeHtml(row.id) + '\')" title="Редактировать">✎</button>' +
          '<button class="sur-btn sur-btn-danger sur-btn-icon" type="button" onclick="surApp.remove(\'' + escapeHtml(row.id) + '\')" title="Удалить">×</button>' +
        '</div></td>' +
      '</tr>';
    }).join('');
    renderPagination();
  }

  function renderPagination() {
    var totalPages = Math.max(Math.ceil(pagination.total / pagination.pageSize), 1);
    var start = pagination.total ? ((pagination.page - 1) * pagination.pageSize + 1) : 0;
    var end = Math.min(pagination.page * pagination.pageSize, pagination.total);
    document.getElementById('sur-page-info').textContent =
      'Показано ' + start + '-' + end + ' из ' + pagination.total + ' | страница ' + pagination.page + ' из ' + totalPages;
    document.getElementById('sur-page-size').value = String(pagination.pageSize);
  }

  function loadFromApi() {
    var params = new URLSearchParams();
    var search = document.getElementById('sur-search').value.trim();
    params.set('page', pagination.page);
    params.set('limit', pagination.pageSize);
    if (search) params.set('search', search);
    return api('?' + params.toString()).then(function(res) {
      records = (res.rows || []).map(function(r) {
        return { id: r.id, data: r.data || {} };
      });
      pagination.total = res.total || 0;
      pagination.page = res.page || pagination.page;
      pagination.pageSize = res.limit || pagination.pageSize;
      renderTable();
    });
  }

  function reload() {
    setStatus('Загрузка...', 'loading');
    loadFromApi().then(function() {
      setStatus('', '');
    }).catch(function(e) {
      records = [];
      pagination.total = 0;
      renderTable();
      setStatus('БД недоступна', 'error');
      showToast('Не удалось загрузить данные: ' + e.message, 'error');
    });
  }

  function save(event) {
    event.preventDefault();
    var data = collectForm();
    var payload = { entryType: 'surgery', data: data, pageId: wikiPageId() };
    var request = editingId
      ? api('/' + editingId, { method: 'PUT', body: JSON.stringify(payload) })
      : api('', { method: 'POST', body: JSON.stringify(payload) });
    request.then(function() {
      showToast('Запись сохранена', 'success');
      resetForm();
      reload();
    }).catch(function(e) {
      showToast('Ошибка сохранения: ' + e.message, 'error');
    });
  }

  function edit(id) {
    var row = records.find(function(r) { return r.id === id; });
    if (!row) return;
    editingId = row.id;
    renderForm(row.data || {});
    document.querySelector('.sur-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function remove(id) {
    if (!confirm('Удалить запись?')) return;
    api(withPageId('/' + id), { method: 'DELETE' }).then(function() {
      showToast('Удалено', 'success');
      reload();
    }).catch(function(e) { showToast('Ошибка удаления: ' + e.message, 'error'); });
  }

  function clearFilters() {
    document.getElementById('sur-search').value = '';
    pagination.page = 1;
    reload();
  }

  function onSearchChange() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function() { pagination.page = 1; reload(); }, 350);
  }

  function prevPage() {
    if (pagination.page <= 1) return;
    pagination.page -= 1;
    reload();
  }

  function nextPage() {
    var totalPages = Math.max(Math.ceil(pagination.total / pagination.pageSize), 1);
    if (pagination.page >= totalPages) return;
    pagination.page += 1;
    reload();
  }

  function changePageSize(value) {
    pagination.pageSize = Number(value) || 50;
    pagination.page = 1;
    reload();
  }

  function exportExcel() {
    if (!window.ExcelJS) { showToast('Библиотека ExcelJS не загружена', 'error'); return; }
    showToast('Готовлю Excel...', 'success');
    api(withPageId('/export-data')).then(function(exportRows) {
      buildExcel(exportRows || []);
    }).catch(function(e) {
      showToast('Ошибка экспорта: ' + e.message, 'error');
    });
  }

  function buildExcel(exportRows) {
    var wb = new ExcelJS.Workbook();
    wb.creator = 'Alfa Wiki';
    wb.created = new Date();

    var ws = wb.addWorksheet('Хирургия');
    ws.addRow(FIELDS.map(function(f) { return f.label; }));
    exportRows.forEach(function(row) {
      var d = row.data || {};
      ws.addRow(FIELDS.map(function(f) { return d[f.name] || ''; }));
    });

    var borderStyle = { style: 'thin', color: { argb: 'FF000000' } };
    var border = { top: borderStyle, left: borderStyle, bottom: borderStyle, right: borderStyle };
    ws.eachRow(function(row, rowNumber) {
      row.eachCell({ includeEmpty: true }, function(cell) { cell.border = border; });
    });
    ws.getRow(1).font = { bold: true, color: { argb: 'FFFFFFFF' } };
    ws.getRow(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF2563EB' } };
    ws.getRow(1).alignment = { vertical: 'middle', horizontal: 'center' };
    ws.views = [{ state: 'frozen', ySplit: 1 }];
    ws.columns.forEach(function(col) {
      var max = 12;
      col.eachCell({ includeEmpty: true }, function(cell) {
        max = Math.max(max, String(cell.value || '').length + 2);
      });
      col.width = Math.min(max, 40);
    });

    wb.xlsx.writeBuffer().then(function(buffer) {
      var blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'Хирургический_стационар_' + today() + '.xlsx';
      a.click();
      URL.revokeObjectURL(url);
      showToast('Excel сформирован', 'success');
    });
  }

  function openImport() {
    document.getElementById('sur-import-file').click();
  }

  function importExcel(file) {
    if (!file) return;
    if (!confirm('Импортировать данные из Excel? Записи будут добавлены в БД.')) {
      document.getElementById('sur-import-file').value = '';
      return;
    }
    var formData = new FormData();
    formData.append('file', file);
    formData.append('pageId', wikiPageId());
    setStatus('Импорт...', 'loading');
    uploadApi('/import', formData).then(function(result) {
      document.getElementById('sur-import-file').value = '';
      showToast('Добавлено: ' + result.total + ', пропущено: ' + (result.skipped || 0), 'success');
      pagination.page = 1;
      reload();
    }).catch(function(e) {
      document.getElementById('sur-import-file').value = '';
      setStatus('', '');
      showToast('Ошибка импорта: ' + e.message, 'error');
    });
  }

  function clearAllData() {
    if (!confirm('Удалить все данные хирургического стационара?')) return;
    var answer = prompt('Для подтверждения введите УДАЛИТЬ');
    if (answer !== 'УДАЛИТЬ') { showToast('Очистка отменена', 'error'); return; }
    setStatus('Очистка...', 'loading');
    api(withPageId(''), { method: 'DELETE' }).then(function(result) {
      editingId = '';
      pagination.page = 1;
      records = [];
      resetForm();
      reload();
      showToast('Удалено записей: ' + (result.deleted || 0), 'success');
    }).catch(function(e) {
      setStatus('', '');
      showToast('Ошибка очистки: ' + e.message, 'error');
    });
  }

  function collapseSidebar() {
    // Страница встраивается в wiki: тот же window, что и React-приложение.
    // Layout слушает 'spreadsheet-page' и сворачивает сайдбар, давая больше места таблице.
    try {
      window.dispatchEvent(new CustomEvent('spreadsheet-page', { detail: { active: true } }));
      var rootEl = document.getElementById('surgery-app');
      if (rootEl && window.MutationObserver) {
        var obs = new MutationObserver(function() {
          if (!document.body.contains(rootEl)) {
            window.dispatchEvent(new CustomEvent('spreadsheet-page', { detail: { active: false } }));
            obs.disconnect();
          }
        });
        obs.observe(document.body, { childList: true, subtree: true });
      }
    } catch (e) { /* вне wiki — игнорируем */ }
  }

  function init() {
    collapseSidebar();
    resolveWikiPageId();
    renderForm();
    reload();
    api('/whoami').then(function(info) {
      if (info.isAdmin) {
        document.getElementById('sur-btn-import').style.display = '';
        document.getElementById('sur-btn-delete-all').style.display = '';
      }
    }).catch(function(e) {
      console.warn('[surgery] whoami failed:', e && e.message);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  return {
    save: save,
    edit: edit,
    remove: remove,
    reload: reload,
    resetForm: resetForm,
    clearFilters: clearFilters,
    onSearchChange: onSearchChange,
    exportExcel: exportExcel,
    openImport: openImport,
    importExcel: importExcel,
    clearAllData: clearAllData,
    prevPage: prevPage,
    nextPage: nextPage,
    changePageSize: changePageSize
  };
})();
</script>
</body>
</html>
