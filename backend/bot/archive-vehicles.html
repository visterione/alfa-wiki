<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
#vehicles-app {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
  max-width: 100%;
  margin: 0 auto;
}

/* Блок архива (purple theme) */
.veh-bot-info {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 20px 24px;
  background: linear-gradient(135deg, #f3e8ff 0%, #ede9fe 100%);
  border: 1px solid #c084fc;
  border-radius: 12px;
  margin-bottom: 24px;
}

.veh-bot-qr {
  width: 100px;
  height: 100px;
  background: #fff;
  border-radius: 8px;
  padding: 8px;
  flex-shrink: 0;
}

.veh-bot-qr svg {
  width: 100%;
  height: 100%;
  display: block;
  margin: 0;
  color: #a855f7;
}

.veh-bot-content {
  flex: 1;
}

.veh-bot-title {
  font-size: 16px;
  font-weight: 600;
  color: #581c87;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.veh-bot-title svg {
  width: 20px;
  height: 20px;
  color: #a855f7;
}

.veh-bot-desc {
  font-size: 14px;
  color: #6b21a8;
  margin-bottom: 10px;
  line-height: 1.4;
}

.veh-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.veh-stat-card {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 20px;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  border: 1px solid #e5e7eb;
}

.veh-stat-icon {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.veh-stat-icon svg { width: 24px; height: 24px; }
.veh-stat-icon.total { background: #f3e8ff; color: #9333ea; }
.veh-stat-icon.danger { background: #fee2e2; color: #dc2626; }
.veh-stat-icon.warning { background: #fef3c7; color: #d97706; }
.veh-stat-icon.info { background: #ede9fe; color: #7c3aed; }

.veh-stat-info { display: flex; flex-direction: column; }
.veh-stat-value { font-size: 28px; font-weight: 700; color: #111827; line-height: 1.2; }
.veh-stat-label { font-size: 13px; color: #6b7280; margin-top: 2px; }

/* Тулбар и фильтры */
.veh-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.veh-filters {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  flex: 1;
}

.veh-filter-group {
  min-width: 180px;
}

.veh-input {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 14px;
  transition: border-color 0.2s, box-shadow 0.2s;
  box-sizing: border-box;
}

.veh-input:focus {
  outline: none;
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
}

.veh-select {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 14px;
  background: #fff;
  cursor: pointer;
}

.veh-select:focus {
  outline: none;
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
}

.veh-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 18px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}

.veh-btn svg { width: 18px; height: 18px; }

.veh-btn-primary {
  background: #3b82f6;
  color: #fff;
}

.veh-btn-primary:hover { background: #2563eb; }

.veh-btn-secondary {
  background: #f3f4f6;
  color: #374151;
  border: 1px solid #d1d5db;
}

.veh-btn-secondary:hover { background: #e5e7eb; }

/* Кнопки действий в таблице */
.veh-btn-icon {
  width: 32px;
  height: 32px;
  padding: 0;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.veh-btn-icon svg { width: 16px; height: 16px; }

.veh-btn-icon.delete {
  background: #fee2e2;
  color: #dc2626;
}
.veh-btn-icon.delete:hover { background: #fecaca; }

.veh-btn-icon.files {
  background: #fef3c7;
  color: #d97706;
}
.veh-btn-icon.files:hover { background: #fde68a; }

.veh-btn-icon.restore {
  background: #d1fae5;
  color: #059669;
}
.veh-btn-icon.restore:hover { background: #a7f3d0; }

/* Таблица */
.veh-table-container {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  border: 1px solid #e5e7eb;
  overflow: hidden;
}

.veh-table {
  width: 100%;
  border-collapse: collapse;
}

.veh-table th {
  padding: 14px 16px;
  text-align: left;
  background: #f8fafc;
  font-weight: 600;
  font-size: 13px;
  color: #4b5563;
  border-bottom: 2px solid #e5e7eb;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  vertical-align: middle;
}

.veh-table th.sortable { cursor: pointer; user-select: none; }
.veh-table th.sortable:hover { background: #f1f5f9; }
.sort-icon { opacity: 0.4; margin-left: 4px; }
.veh-table th.sorted .sort-icon { opacity: 1; color: #3b82f6; }

.veh-table td {
  padding: 14px 16px;
  border-bottom: 1px solid #f1f5f9;
  font-size: 14px;
  color: #374151;
  vertical-align: middle;
}

.veh-table tr:hover { background: #f8fafc; }
.veh-table tr:last-child td { border-bottom: none; }

/* Индикация - организация */
.veh-organization {
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  display: inline-block;
  background: #e0f2fe;
  color: #0369a1;
}

/* Индикация дат и пробега */
.veh-date, .veh-mileage {
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  display: inline-block;
}
.veh-date.expired, .veh-mileage.expired { background: #fee2e2; color: #dc2626; }
.veh-date.critical, .veh-mileage.critical { background: #fef2f2; color: #b91c1c; }
.veh-date.warning, .veh-mileage.warning { background: #fef3c7; color: #b45309; }
.veh-date.soon, .veh-mileage.soon { background: #fef9c3; color: #a16207; }
.veh-date.ok, .veh-mileage.ok { background: #dcfce7; color: #16a34a; }

/* Состояние */
.veh-condition {
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  display: inline-block;
}
.veh-condition.good { background: #dcfce7; color: #16a34a; }
.veh-condition.satisfactory { background: #fef3c7; color: #b45309; }
.veh-condition.poor { background: #fee2e2; color: #dc2626; }

.veh-actions { display: flex; gap: 6px; }

.veh-loading, .veh-empty { text-align: center; padding: 40px !important; color: #9ca3af; }

/* Модальное окно */
.veh-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10000;
  backdrop-filter: blur(4px);
}

.veh-modal-content {
  background: #fff;
  border-radius: 16px;
  width: 100%;
  max-width: 580px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  margin: 16px;
}

.veh-modal-content.wide {
  max-width: 700px;
}

.veh-modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 24px;
  border-bottom: 1px solid #e5e7eb;
}

.veh-modal-header h3 { margin: 0; font-size: 18px; font-weight: 600; color: #1f2937; }

.veh-modal-close {
  width: 32px;
  height: 32px;
  border: none;
  background: #f3f4f6;
  border-radius: 8px;
  font-size: 20px;
  cursor: pointer;
  color: #6b7280;
  display: flex;
  align-items: center;
  justify-content: center;
}
.veh-modal-close:hover { background: #e5e7eb; }

/* Toast */
.veh-toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  padding: 14px 20px;
  background: #1f2937;
  color: #fff;
  border-radius: 10px;
  font-size: 14px;
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.3s;
  z-index: 10001;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}
.veh-toast.show { opacity: 1; transform: translateY(0); }
.veh-toast.success { background: #059669; }
.veh-toast.error { background: #dc2626; }

/* Files modal styles */
.veh-files-list {
  max-height: 400px;
  overflow-y: auto;
}

.veh-file-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  margin-bottom: 8px;
  background: #f9fafb;
  transition: all 0.2s;
}

.veh-file-item:hover {
  background: #f3f4f6;
  border-color: #d1d5db;
}

.veh-file-info {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 12px;
}

.veh-file-icon {
  width: 40px;
  height: 40px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #dbeafe;
  color: #2563eb;
  flex-shrink: 0;
}

.veh-file-details {
  flex: 1;
  min-width: 0;
}

.veh-file-name {
  font-weight: 500;
  font-size: 14px;
  color: #1f2937;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.veh-file-meta {
  font-size: 12px;
  color: #6b7280;
  margin-top: 2px;
}

.veh-file-actions {
  display: flex;
  gap: 6px;
}

.veh-no-files {
  text-align: center;
  padding: 40px 20px;
  color: #9ca3af;
  font-size: 14px;
}

/* Пагинация */
.veh-pagination {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  background: #f8fafc;
  border-top: 1px solid #e5e7eb;
  gap: 16px;
}

.veh-pagination-info {
  font-size: 14px;
  color: #6b7280;
}

.veh-pagination-controls {
  display: flex;
  align-items: center;
  gap: 8px;
}

.veh-pagination-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 36px;
  height: 36px;
  padding: 0 12px;
  border: 1px solid #d1d5db;
  background: #fff;
  border-radius: 8px;
  font-size: 14px;
  color: #374151;
  cursor: pointer;
  transition: all 0.2s;
}

.veh-pagination-btn:hover:not(:disabled) {
  background: #f3f4f6;
  border-color: #9ca3af;
}

.veh-pagination-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.veh-pagination-btn.active {
  background: #3b82f6;
  border-color: #3b82f6;
  color: #fff;
}

.veh-pagination-btn svg {
  width: 16px;
  height: 16px;
}

/* Подсветка найденной записи из поиска */
.veh-highlight {
  animation: highlightPulse 3s ease-out;
}
.veh-highlight td {
  background: #fef3c7 !important;
}
@keyframes highlightPulse {
  0%, 50% { background: #fde68a; }
  100% { background: transparent; }
}

/* Планшеты */
@media (max-width: 1024px) {
  .veh-table th, .veh-table td { padding: 12px 10px; }
  .veh-stats { grid-template-columns: repeat(2, 1fr); }
}

/* Мобильные устройства */
@media (max-width: 768px) {
  .veh-bot-info {
    flex-direction: column;
    text-align: center;
    padding: 16px;
    gap: 16px;
  }
  .veh-bot-qr { width: 120px; height: 120px; }
  .veh-bot-desc { font-size: 13px; }

  .veh-stats { grid-template-columns: 1fr 1fr; gap: 10px; }
  .veh-stat-card { padding: 14px 12px; gap: 12px; }
  .veh-stat-icon { width: 40px; height: 40px; }
  .veh-stat-icon svg { width: 20px; height: 20px; }
  .veh-stat-value { font-size: 22px; }
  .veh-stat-label { font-size: 11px; }

  .veh-toolbar { flex-direction: column; align-items: stretch; gap: 12px; }
  .veh-filters { flex-direction: column; gap: 10px; }
  .veh-filter-group { min-width: 100%; }
  .veh-btn-primary { width: 100%; justify-content: center; }

  .veh-table-container { border-radius: 8px; }
  .veh-table { font-size: 13px; }
  .veh-table th {
    padding: 10px 8px;
    font-size: 11px;
    letter-spacing: 0;
  }
  .veh-table td { padding: 10px 8px; }

  .veh-table th:nth-child(5),
  .veh-table td:nth-child(5) { display: none; }

  .veh-organization, .veh-date, .veh-mileage, .veh-condition {
    padding: 3px 8px;
    font-size: 11px;
  }

  .veh-btn-icon { width: 28px; height: 28px; }
  .veh-btn-icon svg { width: 14px; height: 14px; }

  .veh-modal-content {
    margin: 8px;
    max-height: calc(100vh - 16px);
    border-radius: 12px;
  }
  .veh-modal-header { padding: 16px; }
  .veh-modal-header h3 { font-size: 16px; }

  .veh-toast {
    left: 16px;
    right: 16px;
    bottom: 16px;
    text-align: center;
  }

  .veh-pagination { flex-wrap: wrap; justify-content: center; }
}

/* Маленькие мобильные */
@media (max-width: 480px) {
  .veh-stats { grid-template-columns: 1fr; gap: 8px; }
  .veh-stat-card {
    flex-direction: row;
    justify-content: flex-start;
    padding: 12px 16px;
  }

  .veh-table th:nth-child(4),
  .veh-table td:nth-child(4) { display: none; }

  .veh-bot-qr { width: 100px; height: 100px; }

  .veh-pagination {
    flex-direction: column;
    gap: 12px;
    padding: 12px 16px;
  }
  .veh-pagination-info { text-align: center; }
  .veh-pagination-btn { min-width: 32px; height: 32px; padding: 0 8px; font-size: 13px; }
}

/* Print styles */
@media print {
  @page {
    size: landscape;
    margin: 10mm;
  }

  h1, h2, h3, h4, h5, h6 {
    display: none !important;
  }

  .veh-bot-info,
  .veh-stats,
  .veh-toolbar,
  .veh-pagination,
  .veh-modal,
  .veh-toast,
  .veh-table th:last-child,
  .veh-table td:last-child {
    display: none !important;
  }

  .veh-table th:nth-child(4),
  .veh-table td:nth-child(4),
  .veh-table th:nth-child(5),
  .veh-table td:nth-child(5) {
    display: table-cell !important;
  }

  .veh-table-container {
    box-shadow: none;
    border: none;
  }

  .veh-table th,
  .veh-table td {
    border: 1px solid #000;
    padding: 6px;
    font-size: 9pt;
  }

  .veh-table {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
}
</style>

  <div class="veh-toolbar">

      <div class="veh-filter-group">
        <input type="text" id="filter-search" placeholder="🔍 Поиск по марке, номеру..." class="veh-input" oninput="vehApp.debounceLoad()">

          <th class="sortable" onclick="vehApp.sortTable('licensePlate')">Гос. номер <span class="sort-icon">↕</span></th>
          <th class="sortable" onclick="vehApp.sortTable('carYear')">Год <span class="sort-icon">↕</span></th>
          <th class="sortable" onclick="vehApp.sortTable('mileage')">Пробег / ТО <span class="sort-icon">↕</span></th>
          <th class="sortable sorted" onclick="vehApp.sortTable('insuranceDate')">Страховка <span class="sort-icon">↕</span></th>

<script>
window.vehApp = (function() {
  var API_URL = window.location.protocol + '//' + window.location.hostname + ':9001/api/vehicles';
  var vehicles = [];
  var sortField = 'insuranceDate';
  var sortOrder = 'ASC';
  var debounceTimer = null;
  var currentPage = 1;
  var pageSize = 50;
  var highlightId = null;

  function getToken() {
    return localStorage.getItem('token');
  }

  function fetchAPI(url, options) {
    options = options || {};
    return fetch(url, {
      method: options.method || 'GET',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + getToken()
      },
      body: options.body
    }).then(function(r) {
      if (!r.ok) return r.json().then(function(e) { throw new Error(e.error || 'Error'); });
      return r.json();
    });
  }

  function showToast(msg, type) {
    var t = document.getElementById('veh-toast');
    t.textContent = msg;
    t.className = 'veh-toast show ' + (type || '');
    setTimeout(function() { t.className = 'veh-toast'; }, 3000);
  }

  function escapeHtml(s) {
    if (!s) return '';
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function formatDate(ds) {
    var d = new Date(ds);
    return ('0'+d.getDate()).slice(-2) + '.' + ('0'+(d.getMonth()+1)).slice(-2) + '.' + d.getFullYear();
  }

  function formatNumber(n) {
    return n ? n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') : '0';
  }

  function getDateClass(ds) {
    var diff = Math.ceil((new Date(ds) - new Date().setHours(0,0,0,0)) / 86400000);
    if (diff < 0) return 'expired';
    if (diff <= 7) return 'critical';
    if (diff <= 30) return 'warning';
    if (diff <= 90) return 'soon';
    return 'ok';
  }

  function getMileageClass(mileage, nextTO) {
    var diff = nextTO - mileage;
    if (diff <= 0) return 'expired';
    if (diff <= 1000) return 'critical';
    if (diff <= 3000) return 'warning';
    if (diff <= 5000) return 'soon';
    return 'ok';
  }

  function getConditionClass(cond) {
    if (cond === 'Хорошее') return 'good';
    if (cond === 'Удовлетворительное') return 'satisfactory';
    return 'poor';
  }

  function loadData() {
    var search = document.getElementById('filter-search').value;
    var cond = document.getElementById('filter-condition').value;

    var url = API_URL + '?archived=true&sortBy=' + sortField + '&sortOrder=' + sortOrder;
    if (search) url += '&search=' + encodeURIComponent(search);
    if (cond) url += '&condition=' + encodeURIComponent(cond);

    fetchAPI(url).then(function(data) {
      vehicles = data;
      if (currentPage > Math.ceil(vehicles.length / pageSize)) {
        currentPage = 1;
      }
      renderTable();
      renderPagination();
      loadStats();
    }).catch(function(e) {
      document.getElementById('veh-table-body').innerHTML = '<tr><td colspan="8" class="veh-empty">Ошибка загрузки данных</td></tr>';
      showToast('Ошибка: ' + e.message, 'error');
    });
  }

  function loadStats() {
    // Stats section removed - no longer needed
  }

  function renderTable() {
    var tb = document.getElementById('veh-table-body');
    if (!vehicles.length) {
      tb.innerHTML = '<tr><td colspan="8" class="veh-empty">Нет данных в архиве</td></tr>';
      return;
    }
    var start = (currentPage - 1) * pageSize;
    var end = Math.min(start + pageSize, vehicles.length);
    var pageData = vehicles.slice(start, end);

    tb.innerHTML = pageData.map(function(v) {
      var isHighlighted = highlightId && v.id === highlightId;
      var dateClass = getDateClass(v.insuranceDate);
      var mileageClass = getMileageClass(v.mileage, v.nextTO);
      var condClass = getConditionClass(v.condition);

      return '<tr data-id="' + v.id + '"' + (isHighlighted ? ' class="veh-highlight"' : '') + '>' +
        '<td><strong>' + escapeHtml(v.carBrand) + '</strong></td>' +
        '<td><span class="veh-organization">' + escapeHtml(v.organization) + '</span></td>' +
        '<td>' + escapeHtml(v.licensePlate) + '</td>' +
        '<td>' + v.carYear + '</td>' +
        '<td><span class="veh-mileage ' + mileageClass + '">' + formatNumber(v.mileage) + ' / ' + formatNumber(v.nextTO) + '</span></td>' +
        '<td><span class="veh-date ' + dateClass + '">' + formatDate(v.insuranceDate) + '</span></td>' +
        '<td><span class="veh-condition ' + condClass + '">' + escapeHtml(v.condition) + '</span></td>' +
        '<td class="veh-actions">' +
          '<button class="veh-btn-icon files" onclick="vehApp.openFilesModal(\'' + v.id + '\')" title="Файлы">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>' +
          '</button>' +
          '<button class="veh-btn-icon restore" onclick="vehApp.restoreVehicle(\'' + v.id + '\')" title="Восстановить">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>' +
          '</button>' +
          '<button class="veh-btn-icon delete" onclick="vehApp.deleteVehicle(\'' + v.id + '\')" title="Удалить">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>' +
          '</button>' +
        '</td>' +
      '</tr>';
    }).join('');

    if (highlightId) {
      setTimeout(function() { highlightId = null; }, 3000);
    }
  }

  function renderPagination() {
    var total = vehicles.length;
    var totalPages = Math.ceil(total / pageSize);
    var pagEl = document.getElementById('veh-pagination');

    if (totalPages <= 1) {
      pagEl.style.display = 'none';
      return;
    }

    pagEl.style.display = 'flex';

    var start = (currentPage - 1) * pageSize + 1;
    var end = Math.min(currentPage * pageSize, total);

    document.getElementById('pag-start').textContent = start;
    document.getElementById('pag-end').textContent = end;
    document.getElementById('pag-total').textContent = total;

    var html = '<button class="veh-pagination-btn" onclick="vehApp.goToPage(' + (currentPage - 1) + ')" ' + (currentPage === 1 ? 'disabled' : '') + '>' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>';

    var startPage = Math.max(1, currentPage - 2);
    var endPage = Math.min(totalPages, startPage + 4);
    if (endPage - startPage < 4) startPage = Math.max(1, endPage - 4);

    if (startPage > 1) {
      html += '<button class="veh-pagination-btn" onclick="vehApp.goToPage(1)">1</button>';
      if (startPage > 2) html += '<span style="color:#9ca3af;padding:0 4px;">...</span>';
    }

    for (var i = startPage; i <= endPage; i++) {
      html += '<button class="veh-pagination-btn' + (i === currentPage ? ' active' : '') + '" onclick="vehApp.goToPage(' + i + ')">' + i + '</button>';
    }

    if (endPage < totalPages) {
      if (endPage < totalPages - 1) html += '<span style="color:#9ca3af;padding:0 4px;">...</span>';
      html += '<button class="veh-pagination-btn" onclick="vehApp.goToPage(' + totalPages + ')">' + totalPages + '</button>';
    }

    html += '<button class="veh-pagination-btn" onclick="vehApp.goToPage(' + (currentPage + 1) + ')" ' + (currentPage === totalPages ? 'disabled' : '') + '>' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>';

    document.getElementById('pag-controls').innerHTML = html;
  }

  function goToPage(p) {
    var totalPages = Math.ceil(vehicles.length / pageSize) || 1;
    if (p < 1 || p > totalPages) return;
    currentPage = p;
    renderTable();
    renderPagination();
  }

  function sortTable(field) {
    var ths = document.querySelectorAll('.veh-table th');
    ths.forEach(function(th) { th.classList.remove('sorted'); });

    if (sortField === field) {
      sortOrder = sortOrder === 'ASC' ? 'DESC' : 'ASC';
    } else {
      sortField = field;
      sortOrder = 'ASC';
    }

    event.target.closest('th').classList.add('sorted');
    loadData();
  }

  function debounceLoad() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(loadData, 300);
  }

  function resetAndLoad() {
    currentPage = 1;
    loadData();
  }

  function restoreVehicle(id) {
    if (!confirm('Восстановить запись из архива?')) return;
    fetchAPI(API_URL + '/' + id + '/archive', {
      method: 'PATCH',
      body: JSON.stringify({ isArchived: false })
    })
      .then(function() {
        showToast('Восстановлено из архива', 'success');
        loadData();
      }).catch(function(e) { showToast('Ошибка: ' + e.message, 'error'); });
  }

  function deleteVehicle(id) {
    if (!confirm('Удалить это ТС из архива? Это действие нельзя отменить.')) return;

    fetchAPI(API_URL + '/' + id, { method: 'DELETE' })
      .then(function() {
        showToast('ТС удалено', 'success');
        loadData();
      })
      .catch(function(e) { showToast('Ошибка: ' + e.message, 'error'); });
  }

  // === FILES MANAGEMENT (READ-ONLY) ===
  var currentVehicleId = null;

  function openFilesModal(id) {
    currentVehicleId = id;
    document.getElementById('files-vehicle-id').value = id;
    document.getElementById('veh-files-modal').style.display = 'flex';
    loadFiles(id);
  }

  function closeFilesModal() {
    document.getElementById('veh-files-modal').style.display = 'none';
    currentVehicleId = null;
  }

  function loadFiles(vehicleId) {
    fetchAPI(API_URL + '/' + vehicleId + '/files')
      .then(function(files) {
        renderFiles(files);
      })
      .catch(function(e) {
        showToast('Ошибка загрузки файлов: ' + e.message, 'error');
      });
  }

  function renderFiles(files) {
    var container = document.getElementById('files-list');
    if (!files || files.length === 0) {
      container.innerHTML = '<div class="veh-no-files">Файлы не прикреплены</div>';
      return;
    }

    // Read-only file list - only download button, no delete
    container.innerHTML = files.map(function(file) {
      var size = formatFileSize(file.size);
      var date = new Date(file.createdAt).toLocaleDateString('ru-RU');
      return '<div class="veh-file-item">' +
        '<div class="veh-file-info">' +
          '<div class="veh-file-icon">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">' +
              '<path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>' +
              '<polyline points="13 2 13 9 20 9"/>' +
            '</svg>' +
          '</div>' +
          '<div class="veh-file-details">' +
            '<div class="veh-file-name" title="' + escapeHtml(file.originalName) + '">' + escapeHtml(file.originalName) + '</div>' +
            '<div class="veh-file-meta">' + size + ' • ' + date + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="veh-file-actions">' +
          '<button class="veh-btn-icon files" onclick="vehApp.downloadFile(\'' + file.id + '\')" title="Скачать">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">' +
              '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>' +
              '<polyline points="7 10 12 15 17 10"/>' +
              '<line x1="12" y1="15" x2="12" y2="3"/>' +
            '</svg>' +
          '</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function formatFileSize(bytes) {
    if (!bytes) return '0 Б';
    var k = 1024;
    var sizes = ['Б', 'КБ', 'МБ', 'ГБ'];
    var i = Math.floor(Math.log(bytes) / Math.log(k));
    return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
  }

  function downloadFile(fileId) {
    var vehicleId = currentVehicleId;
    if (!vehicleId) return;

    var url = API_URL + '/' + vehicleId + '/files/' + fileId + '/download';

    fetch(url, {
      method: 'GET',
      headers: {
        'Authorization': 'Bearer ' + getToken()
      }
    })
    .then(function(response) {
      if (!response.ok) throw new Error('Download failed');

      var contentDisposition = response.headers.get('Content-Disposition');
      var filename = 'download.pdf';

      if (contentDisposition) {
        var filenameMatch = contentDisposition.match(/filename\*=UTF-8''([^;]+)/);
        if (filenameMatch) {
          filename = decodeURIComponent(filenameMatch[1]);
        } else {
          filenameMatch = contentDisposition.match(/filename="?([^";\n]+)"?/);
          if (filenameMatch) {
            filename = filenameMatch[1];
          }
        }
      }

      return response.blob().then(function(blob) {
        return { blob: blob, filename: filename };
      });
    })
    .then(function(data) {
      var url = window.URL.createObjectURL(data.blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = data.filename;
      document.body.appendChild(a);
      a.click();
      window.URL.revokeObjectURL(url);
      document.body.removeChild(a);
    })
    .catch(function(e) {
      showToast('Ошибка скачивания: ' + e.message, 'error');
    });
  }

  // Проверяем highlight из URL
  function checkHighlight() {
    var params = new URLSearchParams(window.location.search);
    var hl = params.get('highlight');
    if (hl) {
      highlightId = hl;
      history.replaceState(null, '', window.location.pathname);
    }
  }

  // Init
  checkHighlight();
  loadData();

  return {
    loadData: loadData,
    debounceLoad: debounceLoad,
    sortTable: sortTable,
    goToPage: goToPage,
    resetAndLoad: resetAndLoad,
    restoreVehicle: restoreVehicle,
    deleteVehicle: deleteVehicle,
    openFilesModal: openFilesModal,
    closeFilesModal: closeFilesModal,
    downloadFile: downloadFile
  };
})();
</script>
