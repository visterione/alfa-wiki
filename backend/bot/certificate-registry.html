<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Реестр справок</title>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --reg-primary: #2563eb;
  --reg-primary-hover: #1d4ed8;
  --reg-bg: #f8fafc;
  --reg-card: #fff;
  --reg-border: #e5e7eb;
  --reg-border-dark: #cbd5e1;
  --reg-text: #111827;
  --reg-muted: #64748b;
  --reg-success: #16a34a;
  --reg-danger: #dc2626;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--reg-bg);
  color: var(--reg-text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 14px;
}
button, input, textarea, select { font-family: inherit; }
/* Ширины не хватает: таблица широкая, поэтому занимаем всю рабочую область
   без бокового «воздуха» (обёртка wiki-страницы уже растянута на 100%). */
#registry-app { max-width: none; width: 100%; margin: 0; padding: 8px 6px 10px; }
.reg-topbar {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 6px; margin-bottom: 10px; border-bottom: 1px solid var(--reg-border);
  flex-wrap: wrap;
}
.reg-actions { display: flex; gap: 5px; padding-bottom: 8px; flex-shrink: 0; }
.reg-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 34px; padding: 7px 12px; border: 1px solid transparent; border-radius: 7px;
  font-size: 13px; font-weight: 600; cursor: pointer; transition: background .15s, border-color .15s, color .15s;
  white-space: nowrap;
}
.reg-btn-primary { background: var(--reg-primary); color: #fff; }
.reg-btn-primary:hover { background: var(--reg-primary-hover); }
.reg-btn-secondary { background: #fff; color: #334155; border-color: var(--reg-border-dark); }
.reg-btn-secondary:hover { background: #f1f5f9; }
.reg-btn-danger { background: #fee2e2; color: var(--reg-danger); }
.reg-btn-danger:hover { background: #fecaca; }
.reg-btn-success { background: var(--reg-success); color: #fff; }
.reg-btn-success:hover { background: #15803d; }
.reg-btn-icon { width: 34px; min-height: 34px; padding: 0; }
.reg-btn svg { width: 16px; height: 16px; }
.reg-tabs {
  display: flex; gap: 2px; flex: 1; min-width: 0; margin-bottom: 0;
  overflow-x: auto; scrollbar-width: thin;
}
.reg-tab {
  border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--reg-muted);
  padding: 10px 16px; cursor: pointer; font-weight: 600; font-size: 13px; white-space: nowrap;
}
.reg-tab:hover { background: #f1f5f9; color: var(--reg-text); }
.reg-tab.active { color: var(--reg-primary); border-bottom-color: var(--reg-primary); background: #eff6ff; }
.reg-layout { display: grid; grid-template-columns: 1fr; gap: 12px; align-items: start; }
.reg-panel {
  background: var(--reg-card); border: 1px solid var(--reg-border); border-radius: 10px;
  overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.05);
}
.reg-panel-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 14px; border-bottom: 1px solid var(--reg-border);
  background: linear-gradient(135deg, #f0f5ff 0%, #f8fafc 100%);
  border-left: 3px solid var(--reg-primary);
}
.reg-panel-title { margin: 0; font-size: 13px; font-weight: 700; color: var(--reg-primary); letter-spacing: -.01em; }
.reg-form { padding: 13px; }
.reg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.reg-group-title {
  grid-column: 1 / -1; margin: 6px 0 0; padding: 5px 9px; border-radius: 6px;
  background: #eff6ff; color: var(--reg-primary); font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .05em;
}
.reg-field { display: flex; flex-direction: column; gap: 3px; margin-bottom: 0; min-width: 0; }
.reg-field.full { grid-column: 1 / -1; }
.reg-field label {
  font-size: 10px; font-weight: 700; color: #94a3b8;
  text-transform: uppercase; letter-spacing: .06em;
}
.reg-required { color: var(--reg-danger); }
.reg-input, .reg-select, .reg-textarea {
  width: 100%; border: 1px solid var(--reg-border-dark); border-radius: 7px; background: #fff;
  color: var(--reg-text); padding: 6px 9px; min-height: 32px; outline: none; font-size: 13px;
  transition: border-color .15s, box-shadow .15s;
}
.reg-textarea { min-height: 58px; resize: vertical; line-height: 1.4; }
.reg-input:focus, .reg-select:focus, .reg-textarea:focus {
  border-color: var(--reg-primary); box-shadow: 0 0 0 3px rgba(37,99,235,.1);
}
.reg-form-actions {
  display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px;
  padding-top: 10px; border-top: 1px solid var(--reg-border);
}
.reg-checks { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; }
.reg-check {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  font-size: 12px; font-weight: 600; color: #334155; user-select: none;
}
.reg-check input { width: 15px; height: 15px; accent-color: var(--reg-primary); cursor: pointer; margin: 0; }
.reg-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 13px; border-bottom: 1px solid var(--reg-border); flex-wrap: wrap; }
.reg-filters { display: flex; gap: 7px; flex-wrap: wrap; flex: 1; min-width: 0; }
.reg-search { min-width: 130px; flex: 1; }
.reg-filter { min-width: 130px; max-width: 210px; }
.reg-table-wrap { overflow: auto; max-height: calc(100vh - 260px); min-height: 120px; }
.reg-table { width: 100%; border-collapse: collapse; font-size: 10px; }
.reg-table th {
  background: #f8fafc; color: #334155; text-align: center;
  padding: 5px 5px; border: 1px solid var(--reg-border); font-weight: 700; white-space: nowrap;
  position: sticky; z-index: 1;
}
.reg-table thead tr:first-child th { top: 0; height: 26px; }
.reg-table thead tr:nth-child(2) th { top: 26px; }
.reg-table th.reg-grp { background: #eff6ff; color: var(--reg-primary); }
.reg-table td { padding: 4px 5px; border: 1px solid var(--reg-border); vertical-align: top; }
.reg-table tr:hover td { background: #f8fafc; }
.reg-table .center { text-align: center; }
/* Столбец «Печать документа» — только иконка, поэтому фиксируем минимальную ширину */
.reg-table th.col-print, .reg-table td.col-print { width: 30px; min-width: 30px; text-align: center; }
.reg-print-icon { color: var(--reg-primary); font-size: 13px; }
.reg-actions-cell { display: flex; gap: 5px; justify-content: center; }
.reg-table th.col-actions,
.reg-table td.col-actions { position: sticky; right: 0; box-shadow: -2px 0 5px rgba(0,0,0,.07); }
.reg-table th.col-actions { z-index: 3; }
.reg-table td.col-actions { background: #fff; z-index: 2; }
.reg-table tr:hover td.col-actions { background: #f8fafc; }
.reg-empty { text-align: center; color: var(--reg-muted); padding: 28px 12px !important; }
.reg-status { display: inline-flex; align-items: center; gap: 5px; color: var(--reg-muted); font-size: 12px; }
.reg-status.api { color: var(--reg-success); }
.reg-status.error { color: var(--reg-danger); }
.reg-status.loading { color: var(--reg-primary); }
.reg-pagination {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 8px 13px; border-top: 1px solid var(--reg-border); background: #f8fafc; flex-wrap: wrap;
}
.reg-pagination-controls { display: flex; align-items: center; gap: 6px; }
.reg-page-size { width: 80px; }
.reg-toast {
  position: fixed; right: 16px; bottom: 16px; z-index: 1000; padding: 10px 13px;
  border-radius: 8px; background: #111827; color: #fff; box-shadow: 0 10px 30px rgba(15,23,42,.2);
  font-size: 13px; font-weight: 600;
}
.reg-toast.success { background: var(--reg-success); }
.reg-toast.error { background: var(--reg-danger); }
.reg-info-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 15px; height: 15px; margin-left: 4px; padding: 0;
  border: 1px solid var(--reg-primary); border-radius: 50%;
  background: #fff; color: var(--reg-primary);
  font-size: 10px; font-weight: 700; font-style: italic; font-family: Georgia, 'Times New Roman', serif;
  line-height: 1; cursor: pointer; vertical-align: middle; flex-shrink: 0;
}
.reg-info-btn:hover { background: var(--reg-primary); color: #fff; }
.reg-modal-overlay {
  position: fixed; inset: 0; z-index: 2000; background: rgba(15,23,42,.45);
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.reg-modal {
  background: #fff; border-radius: 12px; max-width: 640px; width: 100%;
  max-height: 85vh; display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 20px 60px rgba(15,23,42,.3);
}
.reg-modal-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 13px 18px; border-bottom: 1px solid var(--reg-border);
  background: linear-gradient(135deg, #f0f5ff 0%, #f8fafc 100%);
}
.reg-modal-head h3 { margin: 0; font-size: 15px; font-weight: 700; color: var(--reg-primary); }
.reg-modal-close {
  border: 0; background: transparent; font-size: 24px; line-height: 1;
  color: var(--reg-muted); cursor: pointer; padding: 0 4px;
}
.reg-modal-close:hover { color: var(--reg-danger); }
.reg-modal-body { padding: 14px 18px; overflow: auto; }
.reg-codes-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.reg-codes-table th {
  text-align: left; padding: 7px 10px; background: #f8fafc;
  border-bottom: 2px solid var(--reg-border); font-weight: 700; color: #334155;
  position: sticky; top: 0;
}
.reg-codes-table td { padding: 6px 10px; border-bottom: 1px solid var(--reg-border); vertical-align: top; line-height: 1.35; }
.reg-codes-table .reg-code-num { font-weight: 700; color: var(--reg-primary); text-align: center; white-space: nowrap; }
.reg-codes-table tr:hover td { background: #f8fafc; }
@media (max-width: 640px) {
  #registry-app { padding: 8px 10px 12px; }
  .reg-actions { justify-content: flex-start; width: 100%; }
  .reg-search { min-width: 100%; }
  .reg-table-wrap { max-height: none; }
  .reg-form { padding: 11px; }
}
</style>
</head>
<body>
<div id="registry-app">
  <div class="reg-topbar">
    <div class="reg-tabs" id="reg-tabs"></div>
    <div class="reg-actions">
      <button class="reg-btn reg-btn-secondary reg-btn-icon" onclick="registryApp.reload()" title="Обновить" aria-label="Обновить">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12a8 8 0 10-2.34 5.66M20 12v6h-6"/></svg>
      </button>
      <button id="reg-btn-import" class="reg-btn reg-btn-secondary reg-btn-icon" onclick="registryApp.openImport()" title="Импорт Excel" aria-label="Импорт Excel" style="display:none">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v3h16v-3"/></svg>
      </button>
      <button class="reg-btn reg-btn-success reg-btn-icon" onclick="registryApp.exportExcel()" title="Скачать Excel" aria-label="Скачать Excel">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v12m0 0l4-4m-4 4l-4-4M4 17v3h16v-3"/></svg>
      </button>
      <button id="reg-btn-delete-all" class="reg-btn reg-btn-danger reg-btn-icon" onclick="registryApp.clearAllData()" title="Удалить все данные" aria-label="Удалить все данные" style="display:none">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7h16M10 11v6m4-6v6M6 7l1 14h10l1-14M9 7V4h6v3"/></svg>
      </button>
      <input type="file" id="reg-import-file" accept=".xlsx,.xls" style="display:none" onchange="registryApp.importExcel(this.files[0])">
    </div>
  </div>

  <div class="reg-layout">
    <section class="reg-panel">
      <div class="reg-panel-head">
        <h2 class="reg-panel-title" id="reg-form-title">Новая справка</h2>
        <span class="reg-status" id="reg-storage-status"></span>
      </div>
      <form class="reg-form" id="reg-form" onsubmit="registryApp.save(event)"></form>
    </section>

    <section class="reg-panel">
      <div class="reg-toolbar">
        <div class="reg-filters">
          <input class="reg-input reg-search" id="reg-search" placeholder="Поиск по таблице" oninput="registryApp.onSearchChange()">
          <select class="reg-select reg-filter" id="reg-filter-clinic" onchange="registryApp.filtersChanged()" title="Клиника">
            <option value="">Все клиники</option>
          </select>
        </div>
        <button class="reg-btn reg-btn-secondary" onclick="registryApp.clearFilters()" type="button">Сбросить</button>
      </div>
      <div class="reg-table-wrap">
        <table class="reg-table">
          <thead id="reg-table-head"></thead>
          <tbody id="reg-table-body"></tbody>
        </table>
      </div>
      <div class="reg-pagination">
        <div class="reg-status" id="reg-page-info">0 записей</div>
        <div class="reg-pagination-controls">
          <button class="reg-btn reg-btn-secondary reg-btn-icon" type="button" onclick="registryApp.prevPage()" title="Назад">‹</button>
          <select class="reg-select reg-page-size" id="reg-page-size" onchange="registryApp.changePageSize(this.value)">
            <option value="50">50</option>
            <option value="100">100</option>
            <option value="200">200</option>
          </select>
          <button class="reg-btn reg-btn-secondary reg-btn-icon" type="button" onclick="registryApp.nextPage()" title="Вперёд">›</button>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
window.registryApp = (function() {
  var API_URL = (window.location.port === '9000' ? window.location.protocol + '//' + window.location.hostname + ':9001' : window.location.origin) + '/api/certificate-registry';
  var records = [];
  var editingId = '';
  var pagination = { page: 1, pageSize: 50, total: 0 };
  var searchTimer = null;
  var currentIssuer = ''; // ФИО текущего пользователя в формате «Иванов И. И.»

  // Вкладка = организация + год (как лист в исходном Excel).
  var ORGS = [
    { id: 'prestige', title: 'Престиж' },
    { id: 'labgroup', title: 'Лабгрупп' },
    { id: 'alex', title: 'Алекс', firstYear: 2026 }
  ];
  // Годы вкладок: с 2024 по «следующий после текущего», чтобы вкладка на будущий год
  // всегда была заранее и список не пришлось править руками каждый январь.
  var FIRST_YEAR = 2024;
  var CURRENT_YEAR = new Date().getFullYear();
  var BASE_YEARS = [];
  for (var _y = FIRST_YEAR; _y <= Math.max(CURRENT_YEAR + 1, 2027); _y++) BASE_YEARS.push(_y);

  var years = BASE_YEARS.slice();
  var tabs = [];                       // [{ org, year, title }]
  // По умолчанию открываем Престиж текущего года
  var activeOrg = 'prestige';
  var activeYear = BASE_YEARS.indexOf(CURRENT_YEAR) !== -1
    ? CURRENT_YEAR
    : BASE_YEARS[BASE_YEARS.length - 1];

  // Порядок как в файле: по годам, внутри года — Престиж, Лабгрупп и Алекс.
  // Алекс ведётся только с 2026 года, поэтому более ранние вкладки не создаём.
  function buildTabs() {
    tabs = [];
    years.forEach(function(y) {
      ORGS.forEach(function(o) {
        if (o.firstYear && y < o.firstYear) return;
        tabs.push({ org: o.id, year: y, title: o.title + ' ' + y });
      });
    });
  }

  function tabKey(org, year) { return org + '|' + year; }

  // Единая структура столбцов для обеих организаций.
  // group — название объединённой ячейки-шапки над столбцами (астериск в ТЗ).
  // short — короткая подпись для шапки таблицы: у части столбцов значения короче
  // заголовка, и полный текст растягивал бы столбец впустую (в Excel идёт label).
  var fields = [
    { name: 'printed', label: 'Печать документа', short: '🖨', type: 'checkbox' },
    { name: 'seqNumber', label: '№ п/п', type: 'number' },
    { name: 'certNumber', label: '№ справки', short: '№ спр.', type: 'text' },
    { name: 'correctionNumber', label: '№ корректировки', short: '№ корр.', type: 'text' },

    { name: 'sumCode1', label: 'По коду услуги 1', short: 'Код 1', group: 'Сумма расходов', type: 'number', step: '0.01' },
    { name: 'sumCode2', label: 'По коду услуги 2', short: 'Код 2', group: 'Сумма расходов', type: 'number', step: '0.01' },

    { name: 'tpFio', label: 'Фамилия, имя, отчество', short: 'ФИО', group: 'Налогоплательщик', type: 'text' },
    { name: 'tpInn', label: 'ИНН', group: 'Налогоплательщик', type: 'text' },
    { name: 'tpBirthDate', label: 'Дата рождения', short: 'Д. р.', group: 'Налогоплательщик', type: 'date' },
    { name: 'tpDocCode', label: 'Код документа', short: 'Код док.', group: 'Налогоплательщик', type: 'text', info: 'docCodes' },
    { name: 'tpDocSeries', label: 'Серия, номер', short: 'Серия, №', group: 'Налогоплательщик', type: 'text' },
    { name: 'tpDocDate', label: 'Дата выдачи', short: 'Выдан', group: 'Налогоплательщик', type: 'date' },

    { name: 'ptFio', label: 'Фамилия, имя, отчество', short: 'ФИО', group: 'Пациент', type: 'text' },
    { name: 'ptInn', label: 'ИНН', group: 'Пациент', type: 'text' },
    { name: 'ptBirthDate', label: 'Дата рождения', short: 'Д. р.', group: 'Пациент', type: 'date' },
    { name: 'ptDocCode', label: 'Код документа', short: 'Код док.', group: 'Пациент', type: 'text', info: 'docCodes' },
    { name: 'ptDocSeries', label: 'Серия, номер', short: 'Серия, №', group: 'Пациент', type: 'text' },
    { name: 'ptDocDate', label: 'Дата выдачи', short: 'Выдан', group: 'Пациент', type: 'date' },

    { name: 'issuerName', label: 'ФИО выдавшего справку', short: 'Кто выдал', type: 'text' },
    { name: 'formDate', label: 'Дата формирования', short: 'Дата форм.', type: 'date' },
    { name: 'status', label: 'Статус', type: 'text' },
    { name: 'clinics', label: 'Клиники', type: 'text', datalist: 'clinics' }
  ];

  // Пары «поле налогоплательщика → поле пациента» для галочки «одно лицо».
  var SAME_PERSON_MAP = [
    ['tpFio', 'ptFio'], ['tpInn', 'ptInn'], ['tpBirthDate', 'ptBirthDate'],
    ['tpDocCode', 'ptDocCode'], ['tpDocSeries', 'ptDocSeries'], ['tpDocDate', 'ptDocDate']
  ];
  var samePerson = false;   // состояние галочки, переживает перерисовку формы

  // Готовые значения клиник — свои для каждой организации (вкладки).
  // Список подсказок, но ввести можно и произвольное значение (в данных встречаются
  // перечисления через запятую, например «Престиж, Кидс»).
  var CLINIC_OPTIONS = {
    prestige: ['Престиж', 'Кидс', 'Линия'],
    labgroup: ['Смайл', '3К'],
    alex: ['Алекс']
  };
  var ALL_CLINICS = ['Престиж', 'Кидс', 'Линия', 'Смайл', '3К', 'Алекс'];

  // Приводим подпись клиники к единому виду («ПРестиж»/«КИДС» → «Престиж»/«Кидс»)
  function prettyClinic(label) {
    var lower = String(label == null ? '' : label).trim().toLowerCase();
    if (!lower) return '';
    for (var i = 0; i < ALL_CLINICS.length; i++) {
      if (ALL_CLINICS[i].toLowerCase() === lower) return ALL_CLINICS[i];
    }
    return lower.charAt(0).toUpperCase() + lower.slice(1);
  }

  // «Стеценко Виталий Витальевич» → «Стеценко В. В.»
  function formatFio(full) {
    var parts = String(full == null ? '' : full).trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '';
    var initials = parts.slice(1, 3).map(function(p) { return p.charAt(0).toUpperCase() + '.'; }).join(' ');
    return initials ? parts[0] + ' ' + initials : parts[0];
  }

  // Справочники для кнопок «i» в шапке. Ключ совпадает с field.info.
  var INFO = {
    docCodes: {
      title: 'Коды видов документов',
      columns: ['Код', 'Наименование документа'],
      rows: [
        ['21', 'Паспорт гражданина Российской Федерации'],
        ['3', 'Свидетельство о рождении'],
        ['7', 'Военный билет'],
        ['8', 'Временное удостоверение, выданное взамен военного билета'],
        ['10', 'Паспорт иностранного гражданина'],
        ['11', 'Свидетельство о рассмотрении ходатайства о признании лица беженцем на территории Российской Федерации по существу'],
        ['12', 'Вид на жительство в Российской Федерации'],
        ['13', 'Удостоверение беженца'],
        ['14', 'Временное удостоверение личности гражданина Российской Федерации'],
        ['15', 'Разрешение на временное проживание в Российской Федерации'],
        ['19', 'Свидетельство о предоставлении временного убежища на территории Российской Федерации'],
        ['23', 'Свидетельство о рождении, выданное уполномоченным органом иностранного государства'],
        ['24', 'Удостоверение личности военнослужащего Российской Федерации'],
        ['27', 'Военный билет офицера запаса'],
        ['91', 'Иные документы']
      ]
    }
  };

  function getToken() {
    return localStorage.getItem('token') || sessionStorage.getItem('token') || '';
  }

  // ID wiki-страницы, в которую встроена таблица. Нужен, чтобы изменения фиксировались
  // в «Журнале изменений» этой страницы. Определяем сами по slug из URL (не зависим от React).
  var PAGES_URL = API_URL.replace(/\/certificate-registry\/?$/, '/pages');
  var wikiPageIdCache = '';

  function wikiPageId() {
    return wikiPageIdCache || (window.__WIKI_PAGE__ && window.__WIKI_PAGE__.id) || '';
  }

  function currentSlug() {
    var parts = window.location.pathname.split('/').filter(Boolean);
    if (!parts.length) return '';
    try { return decodeURIComponent(parts[parts.length - 1]); }
    catch (e) { return parts[parts.length - 1]; }
  }

  // Разрешаем pageId по slug через API страниц и кэшируем — вызывается один раз при инициализации.
  function resolveWikiPageId() {
    if (wikiPageId()) return Promise.resolve(wikiPageId());
    var slug = currentSlug();
    if (!slug) return Promise.resolve('');
    return fetch(PAGES_URL + '/' + encodeURIComponent(slug), {
      headers: { 'Authorization': 'Bearer ' + getToken() }
    }).then(function(r) {
      return r.ok ? r.json() : null;
    }).then(function(page) {
      wikiPageIdCache = (page && page.id) || '';
      return wikiPageIdCache;
    }).catch(function() { return ''; });
  }

  function withPageId(path) {
    var id = wikiPageId();
    if (!id) return path;
    return path + (path.indexOf('?') === -1 ? '?' : '&') + 'pageId=' + encodeURIComponent(id);
  }

  function api(path, options) {
    options = options || {};
    var controller = window.AbortController ? new AbortController() : null;
    var timeout = setTimeout(function() { if (controller) controller.abort(); }, options.timeout || 12000);
    return fetch(API_URL + path, {
      method: options.method || 'GET',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() },
      body: options.body,
      signal: controller ? controller.signal : undefined
    }).then(function(r) {
      clearTimeout(timeout);
      if (!r.ok) return r.text().then(function(txt) {
        var msg = 'Ошибка ' + r.status;
        try { var j = JSON.parse(txt); msg = j.error || j.message || msg; } catch(x) { if (txt && txt.length < 200) msg = txt || msg; }
        throw new Error(msg);
      });
      return r.json();
    }).catch(function(e) {
      clearTimeout(timeout);
      if (e.name === 'AbortError') throw new Error('Сервер не ответил за 12 секунд');
      throw e;
    });
  }

  function uploadApi(path, formData, options) {
    options = options || {};
    var controller = window.AbortController ? new AbortController() : null;
    var timeout = setTimeout(function() { if (controller) controller.abort(); }, options.timeout || 120000);
    return fetch(API_URL + path, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + getToken() },
      body: formData,
      signal: controller ? controller.signal : undefined
    }).then(function(r) {
      clearTimeout(timeout);
      if (!r.ok) return r.text().then(function(txt) {
        var msg = 'Ошибка ' + r.status;
        try { var j = JSON.parse(txt); msg = j.error || j.message || msg; } catch(x) { if (txt && txt.length < 200) msg = txt || msg; }
        throw new Error(msg);
      });
      return r.json();
    }).catch(function(e) {
      clearTimeout(timeout);
      if (e.name === 'AbortError') throw new Error('Импорт не ответил за 120 секунд');
      throw e;
    });
  }

  function todayDMY() {
    var d = new Date();
    return String(d.getDate()).padStart(2, '0') + '.' +
           String(d.getMonth() + 1).padStart(2, '0') + '.' + d.getFullYear();
  }

  function today() { return new Date().toISOString().slice(0, 10); }

  function focusNextFormInput(el) {
    var inputs = Array.from(document.querySelectorAll(
      '#reg-form input.reg-input:not([readonly]), #reg-form select.reg-select, #reg-form textarea.reg-textarea'
    ));
    var idx = inputs.indexOf(el);
    if (idx >= 0 && idx < inputs.length - 1) inputs[idx + 1].focus();
  }

  function attachDateMask(el) {
    el.addEventListener('keydown', function(e) {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (['Tab','Backspace','Delete','ArrowLeft','ArrowRight','Home','End'].includes(e.key)) return;
      if (!/^\d$/.test(e.key)) e.preventDefault();
    });
    el.addEventListener('input', function() {
      var caretBefore = this.selectionStart;
      var digitsBefore = (this.value.substring(0, caretBefore).match(/\d/g) || []).length;
      var digits = this.value.replace(/\D/g, '').substring(0, 8);
      var f = digits.length > 4
        ? digits.slice(0,2) + '.' + digits.slice(2,4) + '.' + digits.slice(4)
        : digits.length > 2 ? digits.slice(0,2) + '.' + digits.slice(2) : digits;
      this.value = f;
      var n = 0, c = 0;
      while (n < f.length && c < digitsBefore) { if (/\d/.test(f[n])) c++; n++; }
      this.setSelectionRange(n, n);
      if (digits.length >= 8) focusNextFormInput(this);
    });
  }

  function attachMasks() {
    document.querySelectorAll('#reg-form [data-mask="date"]').forEach(attachDateMask);
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  }

  function formatValue(value) {
    return value == null || value === '' ? '-' : escapeHtml(value);
  }

  function showToast(message, type) {
    var el = document.createElement('div');
    el.className = 'reg-toast' + (type ? ' ' + type : '');
    el.textContent = message;
    document.body.appendChild(el);
    setTimeout(function() { el.remove(); }, 2600);
  }

  function normalizeRows(rows) {
    return rows.map(function(row) {
      return {
        id: row.id,
        org: row.org,
        year: row.year == null ? null : Number(row.year),
        seqNumber: row.seqNumber,
        data: row.data || {},
        createdAt: row.createdAt || new Date().toISOString(),
        updatedAt: row.updatedAt || row.createdAt || new Date().toISOString()
      };
    });
  }

  function setStatus(text, type) {
    var el = document.getElementById('reg-storage-status');
    el.className = 'reg-status ' + (type || '');
    el.textContent = text || '';
  }

  function renderTabs() {
    document.getElementById('reg-tabs').innerHTML = tabs.map(function(tab) {
      var active = (tab.org === activeOrg && tab.year === activeYear) ? ' active' : '';
      return '<button type="button" class="reg-tab' + active + '" onclick="registryApp.switchTab(\'' +
        tab.org + '\',' + tab.year + ')">' + escapeHtml(tab.title) + '</button>';
    }).join('');
  }

  function renderForm(data) {
    data = data || {};
    var html = '';
    var lastGroup = null;
    fields.forEach(function(field) {
      if (field.type === 'checkbox') return;   // галочки живут отдельным блоком под сеткой
      if (field.group && field.group !== lastGroup) {
        html += '<div class="reg-group-title">' + escapeHtml(field.group) + '</div>';
      }
      if (!field.group && lastGroup) {
        // ничего — просто продолжаем сеткой
      }
      lastGroup = field.group || null;

      var value = field.name === 'seqNumber' ? (data.seqNumber || '') : (data[field.name] || '');
      // Значения по умолчанию для новой справки — их всегда можно изменить вручную
      if (!editingId && !value) {
        if (field.name === 'issuerName') value = currentIssuer;
        else if (field.name === 'formDate') value = todayDMY();
      }
      var cls = 'reg-field';
      var infoBtn = field.info ? ' <button type="button" class="reg-info-btn" onclick="registryApp.showInfo(\'' + field.info + '\')" title="Справочная информация">i</button>' : '';
      var label = '<label for="reg-' + field.name + '">' + escapeHtml(field.label) + infoBtn + '</label>';
      var input;
      var step = field.step ? ' step="' + field.step + '"' : '';
      var inputType = field.type;
      var extraAttr = '';
      if (field.type === 'date') {
        inputType = 'text';
        extraAttr = ' data-mask="date" placeholder="ДД.ММ.ГГГГ" maxlength="10" autocomplete="off"';
      }
      var listAttr = field.datalist ? ' list="reg-dl-' + field.name + '" autocomplete="off"' : '';
      input = '<input class="reg-input" id="reg-' + field.name + '" name="' + field.name + '" type="' + inputType + '" value="' + escapeHtml(value) + '"' + step + extraAttr + listAttr + '>';
      if (field.datalist === 'clinics') {
        input += '<datalist id="reg-dl-' + field.name + '">' +
          (CLINIC_OPTIONS[activeOrg] || []).map(function(opt) {
            return '<option value="' + escapeHtml(opt) + '">';
          }).join('') + '</datalist>';
      }
      html += '<div class="' + cls + '">' + label + input + '</div>';
    });

    // «Печать документа» по умолчанию включена у новой справки; при редактировании
    // берём сохранённое значение (у старых записей поля нет — значит, не печаталась).
    var printed = (!editingId && data.printed === undefined) ? true : isTruthy(data.printed);

    document.getElementById('reg-form-title').textContent = editingId ? 'Редактировать справку' : 'Новая справка';
    document.getElementById('reg-form').innerHTML =
      '<div class="reg-grid">' + html + '</div>' +
      '<div class="reg-checks">' +
        '<label class="reg-check">' +
          '<input type="checkbox" id="reg-same-person" name="samePerson"' + (samePerson ? ' checked' : '') +
          ' onchange="registryApp.toggleSamePerson(this.checked)">' +
          'Налогоплательщик и пациент одно лицо' +
        '</label>' +
        '<label class="reg-check">' +
          '<input type="checkbox" id="reg-printed" name="printed"' + (printed ? ' checked' : '') + '>' +
          'Печать документа' +
        '</label>' +
      '</div>' +
      '<div class="reg-form-actions">' +
        '<button class="reg-btn reg-btn-primary" type="submit">' + (editingId ? 'Сохранить изменения' : 'Добавить справку') + '</button>' +
        '<button class="reg-btn reg-btn-secondary" type="button" onclick="registryApp.resetForm()">Очистить</button>' +
      '</div>';

    attachMasks();
    attachSamePersonSync();
    setDefaultNumber();
  }

  function isTruthy(value) {
    return value === true || value === 1 || (value !== '' && value != null && value !== '0' && value !== false);
  }

  // Пока галочка «одно лицо» активна, правки в блоке налогоплательщика
  // сразу отражаются в блоке пациента — иначе пришлось бы снимать/ставить её заново.
  function attachSamePersonSync() {
    var form = document.getElementById('reg-form');
    SAME_PERSON_MAP.forEach(function(pair) {
      var src = form.elements[pair[0]];
      if (src) src.addEventListener('input', function() { if (samePerson) copyToPatient(); });
    });
  }

  function copyToPatient() {
    var form = document.getElementById('reg-form');
    SAME_PERSON_MAP.forEach(function(pair) {
      var src = form.elements[pair[0]], dst = form.elements[pair[1]];
      if (src && dst) dst.value = src.value;
    });
  }

  function toggleSamePerson(checked) {
    samePerson = !!checked;
    if (samePerson) copyToPatient();
  }

  function setDefaultNumber() {
    var numberInput = document.getElementById('reg-seqNumber');
    if (!numberInput || editingId) return;
    if (numberInput.value) return;
    api('/next-number?org=' + encodeURIComponent(activeOrg) + '&year=' + encodeURIComponent(activeYear))
      .then(function(res) { if (!numberInput.value) numberInput.value = res.nextNumber || ''; })
      .catch(function() {});
  }

  function collectForm() {
    var form = document.getElementById('reg-form');
    var data = {};
    fields.forEach(function(field) {
      if (field.name === 'seqNumber') return;
      var el = form.elements[field.name];
      if (!el) return;
      data[field.name] = field.type === 'checkbox' ? (el.checked ? '1' : '') : el.value;
    });
    var seq = form.elements.seqNumber ? Number(form.elements.seqNumber.value) : null;
    return {
      org: activeOrg,
      year: activeYear,
      seqNumber: Number.isFinite(seq) && seq > 0 ? seq : null,
      data: data
    };
  }

  function headLabel(field) { return field.short || field.label; }

  // У сокращённых заголовков полное название остаётся в подсказке.
  function thAttrs(field) {
    var cls = field.type === 'checkbox' ? ' class="col-print"' : '';
    var title = field.short ? ' title="' + escapeHtml(field.label) + '"' : '';
    return cls + title;
  }

  // Двухуровневая шапка: объединённые ячейки-группы (colspan) над своими столбцами,
  // одиночные столбцы растянуты на обе строки (rowspan=2).
  function buildHeaderHtml() {
    var row1 = '', row2 = '';
    var i = 0;
    while (i < fields.length) {
      var f = fields[i];
      if (!f.group) {
        row1 += '<th rowspan="2"' + thAttrs(f) + '>' + escapeHtml(headLabel(f)) + '</th>';
        i++;
      } else {
        var g = f.group, members = [];
        while (i < fields.length && fields[i].group === g) { members.push(fields[i]); i++; }
        row1 += '<th class="reg-grp" colspan="' + members.length + '">' + escapeHtml(g) + '</th>';
        members.forEach(function(m) {
          var info = m.info ? ' <button type="button" class="reg-info-btn" onclick="registryApp.showInfo(\'' + m.info + '\')" title="Справочная информация">i</button>' : '';
          row2 += '<th' + thAttrs(m) + '>' + escapeHtml(headLabel(m)) + info + '</th>';
        });
      }
    }
    row1 += '<th rowspan="2" class="col-actions">Действия</th>';
    return '<tr>' + row1 + '</tr><tr>' + row2 + '</tr>';
  }

  function currentRows() {
    return records.filter(function(r) { return r.org === activeOrg && r.year === activeYear; });
  }

  function renderTable() {
    document.getElementById('reg-table-head').innerHTML = buildHeaderHtml();
    var rows = currentRows();
    var colCount = fields.length + 1;

    if (!rows.length) {
      document.getElementById('reg-table-body').innerHTML =
        '<tr><td class="reg-empty" colspan="' + colCount + '">Нет данных</td></tr>';
      renderPagination();
      return;
    }

    document.getElementById('reg-table-body').innerHTML = rows.map(function(row) {
      return '<tr>' +
        fields.map(function(field) {
          if (field.type === 'checkbox') {
            var on = isTruthy((row.data || {})[field.name]);
            return '<td class="center col-print">' + (on
              ? '<span class="reg-print-icon" title="Печать документа производилась">📄</span>' : '') + '</td>';
          }
          var val = field.name === 'seqNumber' ? row.seqNumber : (row.data || {})[field.name];
          var tdCls = field.name === 'seqNumber' ? 'center' : '';
          return '<td' + (tdCls ? ' class="' + tdCls + '"' : '') + '>' + formatValue(val) + '</td>';
        }).join('') +
        '<td class="center col-actions"><div class="reg-actions-cell">' +
          '<button class="reg-btn reg-btn-secondary reg-btn-icon" type="button" onclick="registryApp.copyFrom(\'' + row.id + '\')" title="Новая справка по этому же человеку (копирует налогоплательщика и пациента)">⧉</button>' +
          '<button class="reg-btn reg-btn-secondary reg-btn-icon" type="button" onclick="registryApp.edit(\'' + row.id + '\')" title="Редактировать">✎</button>' +
          '<button class="reg-btn reg-btn-danger reg-btn-icon" type="button" onclick="registryApp.remove(\'' + row.id + '\')" title="Удалить">×</button>' +
        '</div></td></tr>';
    }).join('');
    renderPagination();
  }

  function renderPagination() {
    var totalPages = Math.max(Math.ceil(pagination.total / pagination.pageSize), 1);
    var start = pagination.total ? ((pagination.page - 1) * pagination.pageSize + 1) : 0;
    var end = Math.min(pagination.page * pagination.pageSize, pagination.total);
    document.getElementById('reg-page-info').textContent =
      'Показано ' + start + '-' + end + ' из ' + pagination.total + ' | страница ' + pagination.page + ' из ' + totalPages;
    document.getElementById('reg-page-size').value = String(pagination.pageSize);
  }

  function renderAll() {
    renderTabs();
    renderTable();
  }

  // Значения фильтра клиник — считает сервер в рамках текущей вкладки (орг + год).
  function loadFilters() {
    var clinicSel = document.getElementById('reg-filter-clinic');
    var curClinic = clinicSel.value;
    return api('/filters?org=' + encodeURIComponent(activeOrg) + '&year=' + encodeURIComponent(activeYear))
      .then(function(res) {
        clinicSel.innerHTML = '<option value="">Все клиники</option>' +
          (res.clinics || []).map(function(c) {
            return '<option value="' + escapeHtml(c.value) + '">' +
              escapeHtml(prettyClinic(c.label)) + ' (' + c.count + ')</option>';
          }).join('');
        clinicSel.value = curClinic; // сохраняем выбор, если он всё ещё доступен
      }).catch(function() {});
  }

  // Годы из данных объединяем с базовым списком вкладок, чтобы записи
  // «нестандартных» лет не оказались недоступны ни на одной вкладке.
  function loadYears() {
    return api('/years').then(function(res) {
      var merged = BASE_YEARS.slice();
      (res.years || []).forEach(function(y) {
        var n = Number(y);
        if (n && merged.indexOf(n) === -1) merged.push(n);
      });
      merged.sort(function(a, b) { return a - b; });
      years = merged;
      buildTabs();
      renderTabs();
      if (res.withoutYear) {
        console.warn('[registry] записей без года (не видны во вкладках):', res.withoutYear);
      }
    }).catch(function() {});
  }

  function loadFromApi() {
    var params = new URLSearchParams();
    var search = document.getElementById('reg-search').value.trim();
    var clinic = document.getElementById('reg-filter-clinic').value;
    params.set('org', activeOrg);
    params.set('year', activeYear);
    params.set('page', pagination.page);
    params.set('limit', pagination.pageSize);
    if (search) params.set('search', search);
    if (clinic) params.set('clinic', clinic);
    return api('?' + params.toString()).then(function(res) {
      records = normalizeRows(res.rows || []);
      pagination.total = res.total || 0;
      pagination.page = res.page || pagination.page;
      pagination.pageSize = res.limit || pagination.pageSize;
      renderAll();
    });
  }

  function filtersChanged() {
    pagination.page = 1;
    reload();
  }

  function reload() {
    setStatus('Загрузка...', 'loading');
    loadFilters();
    loadFromApi().then(function() { setStatus(''); }).catch(function(e) {
      records = [];
      pagination.total = 0;
      renderAll();
      setStatus('БД недоступна', 'error');
      showToast('Не удалось загрузить данные из БД: ' + e.message, 'error');
    });
  }

  // Текущее содержимое формы — чтобы перенести незаконченный ввод на другую вкладку.
  function currentFormValues() {
    var form = document.getElementById('reg-form');
    var values = {};
    if (!form || !form.elements) return values;
    fields.forEach(function(field) {
      var el = form.elements[field.name];
      if (!el) return;
      if (field.type === 'checkbox') values[field.name] = el.checked ? '1' : '';
      else if (el.value) values[field.name] = el.value;
    });
    return values;
  }

  function switchTab(org, year) {
    // Форму при смене вкладки не сбрасываем: типичный сценарий — скопировать данные
    // пациента из вкладки прошлого года и добавить справку в другой год.
    // Полная очистка — только кнопкой «Очистить».
    var draft = currentFormValues();
    delete draft.seqNumber;                        // номер свой у каждой вкладки — подставится заново
    if (org !== activeOrg) delete draft.clinics;   // список клиник зависит от организации

    activeOrg = org;
    activeYear = Number(year) || activeYear;
    editingId = '';
    pagination.page = 1;
    renderForm(draft);
    reload();
  }

  function resetForm() {
    editingId = '';
    samePerson = false;
    renderForm();
  }

  // Поля, которые переносятся кнопкой быстрого копирования: обе секции целиком.
  // Берём из структуры столбцов, чтобы список не разошёлся при её изменении.
  var COPY_GROUPS = ['Налогоплательщик', 'Пациент'];
  function copyableFieldNames() {
    return fields.filter(function(f) { return COPY_GROUPS.indexOf(f.group) !== -1; })
                 .map(function(f) { return f.name; });
  }

  // Быстрое создание новой справки по тому же человеку: переносим данные
  // налогоплательщика и пациента, остальное заполняется заново (номер, даты, суммы).
  function copyFrom(id) {
    var row = records.find(function(r) { return r.id === id; });
    if (!row) return;
    var src = row.data || {};
    var copy = {};
    copyableFieldNames().forEach(function(name) {
      if (src[name]) copy[name] = src[name];
    });

    editingId = '';          // это новая запись, а не редактирование исходной
    renderForm(copy);
    document.querySelector('.reg-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    showToast('Данные скопированы — заполните остальные поля', 'success');
  }

  function save(event) {
    event.preventDefault();
    var payload = collectForm();
    payload.pageId = wikiPageId();
    var request = editingId
      ? api('/' + editingId, { method: 'PUT', body: JSON.stringify(payload) })
      : api('', { method: 'POST', body: JSON.stringify(payload) });
    request.then(function() {
      showToast('Справка сохранена', 'success');
      resetForm();
      reload();
    }).catch(function(e) {
      showToast('Ошибка сохранения в БД: ' + e.message, 'error');
    });
  }

  function edit(id) {
    var row = records.find(function(r) { return r.id === id; });
    if (!row) return;
    activeOrg = row.org;
    if (row.year) activeYear = row.year;
    editingId = row.id;
    samePerson = false;
    renderTabs();
    renderForm(Object.assign({}, row.data, { seqNumber: row.seqNumber }));
    renderTable();
    document.querySelector('.reg-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function remove(id) {
    if (!confirm('Удалить справку?')) return;
    api(withPageId('/' + id), { method: 'DELETE' }).then(function() {
      showToast('Удалено', 'success');
      reload();
    }).catch(function(e) { showToast('Ошибка удаления из БД: ' + e.message, 'error'); });
  }

  function clearFilters() {
    document.getElementById('reg-search').value = '';
    document.getElementById('reg-filter-clinic').value = '';
    pagination.page = 1;
    reload();
  }

  function openImport() {
    document.getElementById('reg-import-file').click();
  }

  function importExcel(file) {
    if (!file) return;
    if (!confirm('Импортировать данные из Excel? Записи будут добавлены в БД.')) {
      document.getElementById('reg-import-file').value = '';
      return;
    }
    var formData = new FormData();
    formData.append('file', file);
    formData.append('pageId', wikiPageId());
    setStatus('Импорт...', 'loading');
    uploadApi('/import', formData).then(function(result) {
      document.getElementById('reg-import-file').value = '';
      showToast('Добавлено: ' + result.total + ', пропущено: ' + (result.skipped || 0), 'success');
      setStatus('');
      if (result.skippedSheets && result.skippedSheets.length) {
        console.warn('[registry] Пропущены листы (нет организации или года в названии):', result.skippedSheets);
      }
      // Столбцы файла, которые не удалось сопоставить — показываем явно,
      // иначе их данные молча не попадут в таблицу.
      if (result.unmapped && result.unmapped.length) {
        console.warn('[registry] Нераспознанные столбцы:', result.unmapped);
        alert('Импорт завершён, но эти столбцы файла не распознаны и не импортированы:\n\n• '
          + result.unmapped.join('\n• ')
          + '\n\nСообщите эти названия — их можно добавить в сопоставление.');
      }
      pagination.page = 1;
      reload();
    }).catch(function(e) {
      document.getElementById('reg-import-file').value = '';
      setStatus('');
      showToast('Ошибка импорта: ' + e.message, 'error');
    });
  }

  function clearAllData() {
    if (!confirm('Удалить все данные реестра справок?')) return;
    var answer = prompt('Для подтверждения введите УДАЛИТЬ');
    if (answer !== 'УДАЛИТЬ') {
      showToast('Очистка отменена', 'error');
      return;
    }
    setStatus('Очистка...', 'loading');
    api(withPageId(''), { method: 'DELETE' }).then(function(result) {
      editingId = '';
      pagination.page = 1;
      records = [];
      renderForm();
      reload();
      showToast('Удалено записей: ' + (result.deleted || 0), 'success');
    }).catch(function(e) {
      setStatus('');
      showToast('Ошибка очистки: ' + e.message, 'error');
    });
  }

  function exportExcel() {
    if (!window.ExcelJS) {
      showToast('Библиотека ExcelJS не загружена', 'error');
      return;
    }
    showToast('Готовлю Excel...', 'success');
    api(withPageId('/export-data')).then(function(exportRows) {
      buildExcel(normalizeRows(exportRows || []));
    }).catch(function(e) {
      showToast('Ошибка экспорта: ' + e.message, 'error');
    });
  }

  // Раскладка колонок для Excel: значения двух строк шапки + список объединений ячеек.
  function excelHeaderLayout() {
    var row1 = [], row2 = [], merges = [];
    var c = 1, i = 0;
    while (i < fields.length) {
      var f = fields[i];
      if (!f.group) {
        row1[c - 1] = f.label;
        row2[c - 1] = '';
        merges.push([1, c, 2, c]);
        c++; i++;
      } else {
        var g = f.group, start = c;
        while (i < fields.length && fields[i].group === g) {
          row1[c - 1] = (c === start ? g : '');
          row2[c - 1] = fields[i].label;
          c++; i++;
        }
        merges.push([1, start, 1, c - 1]);
      }
    }
    return { row1: row1, row2: row2, merges: merges, colCount: c - 1 };
  }

  function buildExcel(exportRows) {
    var wb = new ExcelJS.Workbook();
    wb.creator = 'Alfa Wiki';
    wb.created = new Date();

    var layout = excelHeaderLayout();
    var borderStyle = { style: 'thin', color: { argb: 'FF000000' } };
    var border = { top: borderStyle, left: borderStyle, bottom: borderStyle, right: borderStyle };

    tabs.forEach(function(tab) {
      var ws = wb.addWorksheet(tab.title);
      ws.addRow(layout.row1);
      ws.addRow(layout.row2);
      layout.merges.forEach(function(m) { ws.mergeCells(m[0], m[1], m[2], m[3]); });

      exportRows.filter(function(r) {
        return r.org === tab.org && r.year === tab.year;
      }).forEach(function(row) {
        ws.addRow(fields.map(function(f) {
          if (f.type === 'checkbox') return isTruthy((row.data || {})[f.name]) ? 'Да' : '';
          return f.name === 'seqNumber' ? (row.seqNumber || '') : ((row.data || {})[f.name] || '');
        }));
      });

      // Стили шапки
      [1, 2].forEach(function(rn) {
        var hr = ws.getRow(rn);
        hr.font = { bold: true, color: { argb: 'FF1D4ED8' } };
        hr.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true };
        hr.eachCell({ includeEmpty: true }, function(cell) {
          cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFEFF6FF' } };
        });
      });

      ws.eachRow({ includeEmpty: true }, function(rowObj) {
        for (var ci = 1; ci <= layout.colCount; ci++) {
          rowObj.getCell(ci).border = border;
        }
      });

      ws.views = [{ state: 'frozen', ySplit: 2 }];
      ws.columns.forEach(function(col) {
        var max = 12;
        col.eachCell({ includeEmpty: true }, function(cell) {
          max = Math.max(max, String(cell.value == null ? '' : cell.value).length + 2);
        });
        col.width = Math.min(max, 30);
      });
    });

    wb.xlsx.writeBuffer().then(function(buffer) {
      var blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'Реестр_справок_' + today() + '.xlsx';
      a.click();
      URL.revokeObjectURL(url);
      showToast('Excel сформирован', 'success');
    });
  }

  function onSearchChange() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function() {
      pagination.page = 1;
      reload();
    }, 350);
  }

  function prevPage() {
    if (pagination.page <= 1) return;
    pagination.page -= 1;
    reload();
  }

  function nextPage() {
    var totalPages = Math.max(Math.ceil(pagination.total / pagination.pageSize), 1);
    if (pagination.page >= totalPages) return;
    pagination.page += 1;
    reload();
  }

  function changePageSize(value) {
    pagination.pageSize = Number(value) || 50;
    pagination.page = 1;
    reload();
  }

  // Модалка со справочной информацией (кнопки «i» в шапке столбцов).
  function showInfo(key) {
    var info = INFO[key];
    if (!info) return;
    var existing = document.getElementById('reg-info-overlay');
    if (existing) existing.remove();

    var overlay = document.createElement('div');
    overlay.id = 'reg-info-overlay';
    overlay.className = 'reg-modal-overlay';
    overlay.innerHTML =
      '<div class="reg-modal" role="dialog" aria-modal="true">' +
        '<div class="reg-modal-head">' +
          '<h3>' + escapeHtml(info.title) + '</h3>' +
          '<button type="button" class="reg-modal-close" aria-label="Закрыть">×</button>' +
        '</div>' +
        '<div class="reg-modal-body"><table class="reg-codes-table"><thead><tr>' +
          '<th>' + escapeHtml(info.columns[0]) + '</th><th>' + escapeHtml(info.columns[1]) + '</th>' +
        '</tr></thead><tbody>' +
          info.rows.map(function(r) {
            return '<tr><td class="reg-code-num">' + escapeHtml(r[0]) + '</td><td>' + escapeHtml(r[1]) + '</td></tr>';
          }).join('') +
        '</tbody></table></div>' +
      '</div>';
    document.body.appendChild(overlay);

    function close() {
      overlay.remove();
      document.removeEventListener('keydown', onKey);
    }
    function onKey(e) { if (e.key === 'Escape') close(); }
    overlay.addEventListener('click', function(e) { if (e.target === overlay) close(); });
    overlay.querySelector('.reg-modal-close').addEventListener('click', close);
    document.addEventListener('keydown', onKey);
  }

  // Страница встраивается в wiki (тот же window, что и React). Layout слушает
  // 'spreadsheet-page' и сворачивает сайдбар, освобождая место под таблицу.
  // Плюс сама обёртка контента у wiki-страниц ограничена 80% ширины — для широкой
  // таблицы это лишние поля по бокам, поэтому на время показа реестра снимаем их.
  var WIDE_CSS =
    '.reg-fullwidth { width: 100% !important; max-width: none !important;' +
    ' padding-left: 8px !important; padding-right: 8px !important; }' +
    '.reg-fullwidth .card:has(#registry-app), .reg-fullwidth .page-content:has(#registry-app)' +
    ' { padding-left: 0 !important; padding-right: 0 !important; }';

  function expandWorkArea() {
    var rootEl = document.getElementById('registry-app');
    var wrapper = rootEl && rootEl.closest ? rootEl.closest('.content-wrapper') : null;
    if (!wrapper) return function() {};

    var style = document.createElement('style');
    style.id = 'reg-fullwidth-style';
    style.textContent = WIDE_CSS;
    document.head.appendChild(style);
    wrapper.classList.add('reg-fullwidth');

    return function() {
      wrapper.classList.remove('reg-fullwidth');
      style.remove();
    };
  }

  function collapseSidebar() {
    try {
      window.dispatchEvent(new CustomEvent('spreadsheet-page', { detail: { active: true } }));
      var restoreWidth = expandWorkArea();
      var rootEl = document.getElementById('registry-app');
      if (rootEl && window.MutationObserver) {
        var obs = new MutationObserver(function() {
          if (!document.body.contains(rootEl)) {
            window.dispatchEvent(new CustomEvent('spreadsheet-page', { detail: { active: false } }));
            restoreWidth();
            obs.disconnect();
          }
        });
        obs.observe(document.body, { childList: true, subtree: true });
      }
    } catch (e) { /* вне wiki — игнорируем */ }
  }

  // Поля, которые разрешено подставлять из адреса страницы. Открытый список был бы
  // дырой: в форму можно было бы подсунуть что угодно ссылкой из чата.
  var PREFILL_FIELDS = [
    'tpFio', 'tpInn', 'tpBirthDate', 'tpDocCode', 'tpDocSeries', 'tpDocDate',
    'ptFio', 'ptInn', 'ptBirthDate', 'ptDocCode', 'ptDocSeries', 'ptDocDate',
    'clinics'
  ];

  /**
   * Данные из адреса страницы — сюда приводит кнопка «Внести в реестр справок»
   * под заявкой в чате (backend/services/public/forms/taxDeductionCertificate.js).
   * Заполняем только блоки налогоплательщика и пациента: номер, суммы и даты
   * сотрудник ставит сам.
   */
  function prefillFromUrl() {
    var params = new URLSearchParams(window.location.search);
    var data = {};
    PREFILL_FIELDS.forEach(function(name) {
      var value = params.get(name);
      if (value) data[name] = value.slice(0, 200);
    });
    // «Одно лицо»: галочка сама скопирует блок налогоплательщика в блок пациента
    if (params.get('samePerson') === '1') samePerson = true;
    return Object.keys(data).length || samePerson ? data : null;
  }

  function init() {
    collapseSidebar();
    resolveWikiPageId();
    buildTabs();
    renderTabs();

    var prefill = prefillFromUrl();
    renderForm(prefill);
    if (prefill && samePerson) copyToPatient();
    if (prefill) {
      showToast('Данные из заявки подставлены — проверьте и дозаполните', 'success');
    }

    loadYears();
    reload();
    api('/whoami').then(function(info) {
      if (info.isAdmin) {
        document.getElementById('reg-btn-import').style.display = '';
        document.getElementById('reg-btn-delete-all').style.display = '';
      }
      currentIssuer = formatFio(info.displayName);
      // форма уже отрисована — подставляем ФИО, если поле ещё пустое
      var issuerInput = document.getElementById('reg-issuerName');
      if (currentIssuer && issuerInput && !editingId && !issuerInput.value) {
        issuerInput.value = currentIssuer;
      }
    }).catch(function(e) {
      console.warn('[registry] whoami failed:', e && e.message);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  return {
    switchTab: switchTab,
    resetForm: resetForm,
    toggleSamePerson: toggleSamePerson,
    save: save,
    edit: edit,
    copyFrom: copyFrom,
    remove: remove,
    reload: reload,
    clearFilters: clearFilters,
    filtersChanged: filtersChanged,
    onSearchChange: onSearchChange,
    exportExcel: exportExcel,
    clearAllData: clearAllData,
    openImport: openImport,
    importExcel: importExcel,
    showInfo: showInfo,
    prevPage: prevPage,
    nextPage: nextPage,
    changePageSize: changePageSize
  };
})();
</script>
</body>
