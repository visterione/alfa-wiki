<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Услуги</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="services-app">

<style>
#services-app {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
  max-width: 100%;
  margin: 0 auto;
}

/* Блок заметок */
.srv-notes-card {
  position: relative;
  background: #fffbeb;
  border-radius: 12px;
  border: 1px solid #fde68a;
  margin-bottom: 20px;
  overflow: hidden;
}

.srv-notes-edit-icon {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 28px;
  height: 28px;
  border: none;
  background: transparent;
  border-radius: 6px;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  color: #b45309;
  opacity: 0.5;
  transition: opacity 0.15s, background 0.15s;
  flex-shrink: 0;
}
.srv-notes-edit-icon:hover { opacity: 1; background: #fde68a; }
.srv-notes-edit-icon svg { width: 15px; height: 15px; }

.srv-btn-sm {
  padding: 5px 12px;
  font-size: 13px;
}

.srv-btn-secondary {
  background: #f3f4f6;
  color: #374151;
  border: none;
}
.srv-btn-secondary:hover { background: #e5e7eb; }

.srv-notes-content {
  padding: 14px 42px 14px 18px;
  font-size: 14px;
  color: #374151;
  line-height: 1.6;
  word-break: break-word;
}

.srv-notes-add-hint {
  padding: 12px 18px;
  font-size: 13px;
  color: #b45309;
  cursor: pointer;
  transition: opacity 0.15s;
  opacity: 0.5;
}
.srv-notes-add-hint:hover { opacity: 1; }

.srv-notes-edit-wrap {
  padding: 12px 14px 14px;
}

.srv-notes-toolbar {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 6px 8px;
  background: #fef3c7;
  border: 1px solid #fde68a;
  border-bottom: none;
  border-radius: 8px 8px 0 0;
}

.srv-toolbar-btn {
  width: 30px;
  height: 30px;
  border: none;
  background: transparent;
  border-radius: 5px;
  cursor: pointer;
  font-size: 14px;
  color: #374151;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
  flex-shrink: 0;
}
.srv-toolbar-btn:hover { background: #e5e7eb; }
.srv-toolbar-btn b { font-weight: 700; font-family: Georgia, serif; }
.srv-toolbar-btn i { font-style: italic; font-family: Georgia, serif; }
.srv-toolbar-btn u { text-decoration: underline; font-family: Georgia, serif; }
.srv-toolbar-btn s { text-decoration: line-through; font-family: Georgia, serif; }

.srv-toolbar-divider {
  width: 1px;
  height: 20px;
  background: #d1d5db;
  margin: 0 4px;
}

.srv-color-btn {
  position: relative;
  width: 30px;
  height: 30px;
  border: none;
  background: transparent;
  border-radius: 5px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
  flex-shrink: 0;
}
.srv-color-btn:hover { background: #e5e7eb; }
.srv-color-btn svg { width: 16px; height: 16px; pointer-events: none; }
.srv-color-btn input[type="color"] {
  position: absolute;
  opacity: 0;
  width: 100%;
  height: 100%;
  cursor: pointer;
  padding: 0;
  border: none;
}

.srv-notes-editor {
  min-height: 90px;
  padding: 10px 12px;
  border: 1px solid #fde68a;
  border-radius: 0 0 8px 8px;
  background: #fffde7;
  font-size: 14px;
  font-family: inherit;
  color: #374151;
  line-height: 1.6;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  word-break: break-word;
}
.srv-notes-editor:focus {
  border-color: #f59e0b;
  box-shadow: 0 0 0 3px rgba(245,158,11,0.1);
}

.srv-notes-edit-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 10px;
}

/* Кнопки и фильтры */
.srv-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.srv-filters {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  flex: 1;
}

.srv-search-box {
  position: relative;
  flex: 1;
  min-width: 250px;
}

.srv-search-box svg {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  color: #9ca3af;
  pointer-events: none;
}

.srv-search {
  width: 100%;
  padding: 10px 12px 10px 38px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
  transition: all 0.2s;
}

.srv-search:focus {
  outline: none;
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
}

.srv-select {
  padding: 10px 12px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
  background: #fff;
  cursor: pointer;
  transition: all 0.2s;
  min-width: 150px;
}

.srv-select:focus {
  outline: none;
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
}

.srv-btn {
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.srv-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.srv-btn-primary {
  background: #3b82f6;
  color: #fff;
}

.srv-btn-primary:hover:not(:disabled) {
  background: #2563eb;
}

.srv-btn svg { width: 18px; height: 18px; }

/* Таблица */
.srv-table-container {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  border: 1px solid #e5e7eb;
  overflow: hidden;
}

.srv-table {
  width: 100%;
  border-collapse: collapse;
}

.srv-table th {
  padding: 14px 16px;
  text-align: center;
  background: #f8fafc;
  font-weight: 600;
  font-size: 13px;
  color: #4b5563;
  border-bottom: 2px solid #e5e7eb;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  vertical-align: middle;
  white-space: nowrap;
}

.srv-table th.sortable { cursor: pointer; user-select: none; }
.srv-table th.sortable:hover { background: #f1f5f9; }
.sort-icon { opacity: 0.4; margin-left: 4px; }
.srv-table th.sorted .sort-icon { opacity: 1; color: #3b82f6; }

.srv-table td {
  padding: 14px 16px;
  border-bottom: 1px solid #f1f5f9;
  font-size: 14px;
  color: #374151;
  vertical-align: middle;
}

/* Выравнивание по центру для определенных столбцов */
.srv-table td.center {
  text-align: center;
}

/* Ширина столбцов */
.srv-table th:nth-child(1),
.srv-table td:nth-child(1) { width: 120px; } /* Медцентр */

.srv-table th:nth-child(2),
.srv-table td:nth-child(2) { width: 130px; } /* Код */

.srv-table th:nth-child(3),
.srv-table td:nth-child(3) { width: auto; } /* Название - занимает оставшееся место */

.srv-table th:nth-child(4),
.srv-table td:nth-child(4) { width: 110px; } /* Стоимость */

.srv-table th:nth-child(5),
.srv-table td:nth-child(5) { width: 200px; max-width: 200px; } /* Комментарий */

.srv-table th:nth-child(6),
.srv-table td:nth-child(6) { width: 100px; } /* Действия */

.srv-table td {
  padding: 14px 16px;
  border-bottom: 1px solid #f1f5f9;
  font-size: 14px;
  color: #374151;
  vertical-align: middle;
}

.srv-table tr:hover { background: #f8fafc; }
.srv-table tr:last-child td { border-bottom: none; }

.srv-table tr[data-highlighted="true"] {
  background: #fef3c7 !important;
  animation: highlight-fade 2s ease-out 1s forwards;
}

@keyframes highlight-fade {
  to { background: transparent !important; }
}

/* Цвет медцентра задаётся инлайном из справочника — см. centerTone() */
.srv-medcenter {
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  display: inline-block;
}

/* Цена */
.srv-price {
  font-weight: 600;
  color: #16a34a;
}

/* Комментарий в таблице */
.srv-comment {
  display: block;
  font-size: 13px;
  color: #6b7280;
  word-break: break-word;
}

/* Действия */
.srv-actions {
  display: flex;
  gap: 6px;
  justify-content: center;
}

.srv-action-btn {
  width: 32px;
  height: 32px;
  border: none;
  background: #f3f4f6;
  border-radius: 6px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  color: #6b7280;
}

.srv-action-btn:hover { background: #e5e7eb; color: #374151; }
.srv-action-btn svg { width: 16px; height: 16px; }

.srv-action-btn.edit { color: #f59e0b; }
.srv-action-btn.edit:hover { background: #fef3c7; }

.srv-action-btn.delete { color: #ef4444; }
.srv-action-btn.delete:hover { background: #fee2e2; }

.srv-action-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

.srv-loading, .srv-empty { text-align: center; padding: 40px !important; color: #9ca3af; }

/* Пагинация */
.srv-pagination {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 20px;
  border-top: 1px solid #e5e7eb;
}

.srv-pagination-info { font-size: 14px; color: #6b7280; }

.srv-pagination-controls {
  display: flex;
  gap: 4px;
}

.srv-pagination-btn {
  min-width: 36px;
  height: 36px;
  padding: 0 8px;
  border: 1px solid #d1d5db;
  background: #fff;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  color: #374151;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.srv-pagination-btn:hover:not(:disabled) {
  background: #f9fafb;
  border-color: #3b82f6;
}

.srv-pagination-btn.active {
  background: #3b82f6;
  color: #fff;
  border-color: #3b82f6;
}

.srv-pagination-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.srv-pagination-btn svg { width: 16px; height: 16px; }

/* Модальное окно */
.srv-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10000;
  backdrop-filter: blur(4px);
}

.srv-modal-content {
  background: #fff;
  border-radius: 16px;
  width: 100%;
  max-width: 600px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  margin: 16px;
}

.srv-modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 24px;
  border-bottom: 1px solid #e5e7eb;
}

.srv-modal-header h3 { margin: 0; font-size: 18px; font-weight: 600; color: #1f2937; }

.srv-modal-close {
  width: 32px;
  height: 32px;
  border: none;
  background: #f3f4f6;
  border-radius: 8px;
  font-size: 20px;
  cursor: pointer;
  color: #6b7280;
  display: flex;
  align-items: center;
  justify-content: center;
}
.srv-modal-close:hover { background: #e5e7eb; }

#srv-form { padding: 24px; }

.srv-form-group {
  margin-bottom: 20px;
}

.srv-form-group label {
  display: block;
  margin-bottom: 6px;
  font-size: 14px;
  font-weight: 500;
  color: #374151;
}

.srv-form-group label span {
  color: #ef4444;
  margin-left: 2px;
}

.srv-input, .srv-textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
  transition: all 0.2s;
}

.srv-input:focus, .srv-textarea:focus {
  outline: none;
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
}

.srv-textarea {
  resize: vertical;
  min-height: 80px;
}

.srv-form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.srv-checkbox-group {
  display: flex;
  align-items: center;
  gap: 8px;
}

.srv-checkbox-group input[type="checkbox"] {
  width: 18px;
  height: 18px;
  cursor: pointer;
}

.srv-checkbox-group label {
  margin: 0;
  cursor: pointer;
}

/* Поиск МИС */
.srv-mis-search {
  margin-bottom: 20px;
  padding: 16px;
  background: #f9fafb;
  border-radius: 8px;
  border: 1px solid #e5e7eb;
}

.srv-mis-search-header {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}

.srv-mis-results {
  max-height: 300px;
  overflow-y: auto;
  border: 1px solid #e5e7eb;
  border-radius: 6px;
  background: #fff;
}

.srv-mis-result {
  padding: 12px;
  border-bottom: 1px solid #f1f5f9;
  cursor: pointer;
  transition: background 0.2s;
}

.srv-mis-result:hover {
  background: #f8fafc;
}

.srv-mis-result:last-child {
  border-bottom: none;
}

.srv-mis-result-title {
  font-weight: 500;
  color: #111827;
  margin-bottom: 4px;
}

.srv-mis-result-meta {
  font-size: 13px;
  color: #6b7280;
}

.srv-mis-result-price {
  color: #16a34a;
  font-weight: 600;
}

.srv-mis-empty {
  padding: 24px;
  text-align: center;
  color: #9ca3af;
  font-size: 14px;
}

.srv-form-actions {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  padding: 16px 24px;
  border-top: 1px solid #e5e7eb;
  background: #f9fafb;
}

.srv-btn-secondary {
  background: #fff;
  color: #374151;
  border: 1px solid #d1d5db;
}

.srv-btn-secondary:hover:not(:disabled) {
  background: #f9fafb;
}

/* Toast уведомления */
.srv-toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: #fff;
  padding: 16px 20px;
  border-radius: 8px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.15);
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 10001;
  animation: slideIn 0.3s ease-out;
  border-left: 4px solid #3b82f6;
}

.srv-toast.success { border-left-color: #16a34a; }
.srv-toast.error { border-left-color: #ef4444; }

.srv-toast svg { width: 20px; height: 20px; flex-shrink: 0; }
.srv-toast.success svg { color: #16a34a; }
.srv-toast.error svg { color: #ef4444; }

@keyframes slideIn {
  from { transform: translateX(400px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

/* Адаптив */
@media (max-width: 768px) {
  .srv-header { flex-direction: column; align-items: stretch; }
  .srv-filters { flex-direction: column; }
  .srv-search-box { min-width: 100%; }
  .srv-select { min-width: 100%; }
  .srv-form-row { grid-template-columns: 1fr; }
  .srv-table-container { overflow-x: auto; }
  .srv-table { min-width: 900px; }

  /* Сбрасываем ширину столбцов на мобильных */
  .srv-table th,
  .srv-table td { width: auto !important; }
}

/* Print styles */
@media print {
  @page {
    size: landscape;
    margin: 10mm;
  }

  h1, h2, h3, h4, h5, h6 {
    display: none !important;
  }

  .srv-header,
  .srv-pagination,
  .srv-modal,
  .srv-toast,
  .srv-table th:last-child,
  .srv-table td:last-child {
    display: none !important;
  }

  .srv-table-container {
    box-shadow: none;
    border: none;
  }

  /* Отображаем все строки таблицы при печати (отключаем пагинацию) */
  .srv-table-row {
    display: table-row !important;
  }

  .srv-table th,
  .srv-table td {
    border: 1px solid #000;
    padding: 6px;
    font-size: 9pt;
  }

  .srv-table {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* Сохраняем цвета медцентров при печати */
  .srv-medcenter {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
}
</style>

  <!-- Блок заметок -->
  <div id="srv-notes-block" style="display:none">
    <div class="srv-notes-card">
      <button id="srv-notes-edit-btn" class="srv-notes-edit-icon" onclick="servicesApp.startEditNotes()" title="Редактировать заметку">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>

      <div id="srv-notes-view" class="srv-notes-content" style="display:none"></div>

            <input type="color" value="#e11d48" onchange="document.execCommand('foreColor', false, this.value)" title="Цвет текста">

          <div class="srv-toolbar-divider"></div>
          <button type="button" class="srv-toolbar-btn" onclick="document.execCommand('removeFormat')" title="Сбросить форматирование" style="font-size:12px;color:#6b7280">✕</button>
        </div>
        <div id="srv-notes-editor" class="srv-notes-editor" contenteditable="true"></div>
        <div class="srv-notes-edit-actions">
          <button type="button" class="srv-btn srv-btn-secondary" onclick="servicesApp.cancelEditNotes()">Отмена</button>
          <button type="button" class="srv-btn srv-btn-primary" onclick="servicesApp.saveNotes()">Сохранить</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Заголовок и фильтры -->
  <div class="srv-header">
    <div class="srv-filters">
      <div class="srv-search-box">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input type="text" id="filter-search" class="srv-search" placeholder="Поиск по названию, коду..." oninput="servicesApp.debounceLoad()">
      </div>
      <select id="filter-medcenter" class="srv-select" onchange="servicesApp.resetAndLoad()">
        <option value="">Все медцентры</option>
      </select>
    </div>
    <button id="srv-add-btn" class="srv-btn srv-btn-primary" onclick="servicesApp.openAddModal()" style="display:none">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
      Добавить услугу
    </button>
  </div>

  <!-- Таблица -->
  <div class="srv-table-container">
    <table class="srv-table">
      <thead>
        <tr>
          <th class="sortable sorted" onclick="servicesApp.sortTable('medCenter')">Медцентр <span class="sort-icon">↕</span></th>
          <th class="sortable" onclick="servicesApp.sortTable('serviceCode')">Код <span class="sort-icon">↕</span></th>
          <th class="sortable" onclick="servicesApp.sortTable('serviceName')">Название <span class="sort-icon">↕</span></th>
          <th class="sortable" onclick="servicesApp.sortTable('price')">Стоимость <span class="sort-icon">↕</span></th>
          <th>Комментарий</th>
          <th>Действия</th>
        </tr>
      </thead>
      <tbody id="srv-table-body">
        <tr><td colspan="6" class="srv-loading">Загрузка...</td></tr>
      </tbody>
    </table>
    <div class="srv-pagination" id="srv-pagination" style="display:none;">
      <div class="srv-pagination-info" id="pagination-info">Показано 1-20 из 100</div>
      <div class="srv-pagination-controls" id="pagination-controls"></div>
    </div>
  </div>

  <!-- Модальное окно -->
  <div id="srv-modal" class="srv-modal" style="display:none" onclick="if(event.target===this)servicesApp.closeModal()">
    <div class="srv-modal-content">
      <div class="srv-modal-header">
        <h3 id="modal-title">Добавить услугу</h3>
        <button class="srv-modal-close" onclick="servicesApp.closeModal()">&times;</button>
      </div>
      <form id="srv-form" onsubmit="servicesApp.saveRecord(event)">
        <input type="hidden" id="edit-id">
        <input type="hidden" id="edit-pageslug">

        <!-- Поиск в МИС -->
        <div class="srv-mis-search" id="mis-search-section">
          <div class="srv-mis-search-header">
            <input type="text" id="mis-search-input" class="srv-input" placeholder="Поиск услуги в МИС..." style="flex:1">
            <button type="button" class="srv-btn srv-btn-primary" onclick="servicesApp.searchMIS()">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
              Найти
            </button>
          </div>
          <div class="srv-mis-results" id="mis-results" style="display:none">
            <div class="srv-mis-empty">Введите запрос и нажмите "Найти"</div>
          </div>
        </div>

        <div class="srv-form-group">
          <label>Медцентр <span>*</span></label>
          <!-- Заполняется из справочника медцентров в loadMedCenterRegistry() -->
          <select id="edit-medcenter" required class="srv-select" onchange="servicesApp.onModalMedcenterChange()">
            <option value="">Выберите...</option>
          </select>
        </div>

        <div class="srv-form-row">
          <div class="srv-form-group">
            <label>Код услуги <span>*</span></label>
            <input type="text" id="edit-servicecode" required class="srv-input" placeholder="A09.05.003">
          </div>
          <div class="srv-form-group">
            <label>Стоимость <span>*</span></label>
            <input type="number" id="edit-price" required class="srv-input" min="0" step="0.01" placeholder="1500.00">
          </div>
        </div>

        <div class="srv-form-group">
          <label>Название услуги <span>*</span></label>
          <input type="text" id="edit-servicename" required class="srv-input" placeholder="Медицинская услуга">
        </div>

        <div class="srv-form-group">
          <label>Ссылка на подготовку</label>
          <input type="url" id="edit-preplink" class="srv-input" placeholder="https://example.com/preparation.pdf">
        </div>

        <div class="srv-form-group">
          <label>Комментарий</label>
          <textarea id="edit-comment" class="srv-textarea" placeholder="Дополнительная информация..."></textarea>
        </div>

        <input type="hidden" id="edit-misserviceid">

        <div class="srv-form-actions">
          <button type="button" class="srv-btn srv-btn-secondary" onclick="servicesApp.closeModal()">Отмена</button>
          <button type="submit" class="srv-btn srv-btn-primary">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            Сохранить
          </button>
        </div>
      </form>
    </div>
  </div>

</div>

<script>
window.servicesApp = (function() {
  // Backend всегда на порту 9001
  var API_URL = (window.location.port === '9000' ? window.location.protocol + '//' + window.location.hostname + ':9001' : window.location.origin) + '/api/services';
  var MIS_URL = (window.location.port === '9000' ? window.location.protocol + '//' + window.location.hostname + ':9001' : window.location.origin) + '/api/services';

  // Маппинг «название медцентра → clinic_id в МИС» приходит из справочника
  // (ver. 6.67), см. loadMedCenterRegistry(). Раньше карта была захардкожена здесь,
  // и Сукко в ней не было — завести услугу этому филиалу было нельзя.
  var MEDCENTER_CLINIC_IDS = {};
  var MEDCENTER_COLORS = {};
  var services = [];

  // Бейдж медцентра красим фирменным цветом из справочника. Раньше цвета лежали
  // в CSS правилами по имени клиники, и у филиала без своего правила (Сукко,
  // ИП Микаелян) бейдж оставался серым, хотя цвет в настройках задан.
  function centerTone(name) {
    var m = /^#([0-9a-f]{6})$/i.exec(MEDCENTER_COLORS[name] || '');
    if (!m) return { fg: '#4b5563', bg: '#f3f4f6' };
    var n = parseInt(m[1], 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    return {
      fg: 'rgb(' + [r, g, b].map(function(c) { return Math.round(c * 0.55); }).join(',') + ')',
      bg: 'rgb(' + [r, g, b].map(function(c) { return Math.round(255 - (255 - c) * 0.14); }).join(',') + ')'
    };
  }
  var medcenters = [];
  var sortField = 'medCenter';
  var sortOrder = 'ASC';
  var currentPage = 1;
  var pageSize = 50;
  var debounceTimer;
  var highlightId = null;
  var currentPageSlug = ''; // Slug текущей страницы
  var canEditServices = false;

  // === INIT: Получить slug страницы из URL или data-атрибута ===
  function initPageSlug() {
    // Вариант 1: Из data-атрибута на элементе
    var appEl = document.getElementById('services-app');
    if (appEl && appEl.dataset.pageSlug) {
      currentPageSlug = appEl.dataset.pageSlug;
      return;
    }

    // Вариант 2: Из URL — старый /page/<slug> или новый /explorer/папка/.../<slug>
    var pathParts = window.location.pathname.replace(/\/+$/, '').split('/').filter(Boolean);
    var pageIndex = pathParts.indexOf('page');
    if (pageIndex !== -1 && pathParts[pageIndex + 1]) {
      currentPageSlug = decodeURIComponent(pathParts[pageIndex + 1]);
    } else if (pathParts[0] === 'explorer' && pathParts.length > 1) {
      // slug страницы — всегда последний сегмент пути проводника
      currentPageSlug = decodeURIComponent(pathParts[pathParts.length - 1]);
    }
  }

  // === HELPERS ===
  function getToken() {
    return localStorage.getItem('token');
  }

  function fetchAPI(url, options) {
    options = options || {};
    return fetch(url, {
      method: options.method || 'GET',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + getToken()
      },
      body: options.body
    }).then(function(r) {
      if (!r.ok) return r.json().then(function(e) { throw new Error(e.error || 'Error'); });
      return r.json();
    });
  }

  function showToast(msg, type) {
    var toast = document.createElement('div');
    toast.className = 'srv-toast' + (type ? ' ' + type : '');
    var icon = type === 'success'
      ? '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>'
      : '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>';
    toast.innerHTML = icon + '<span>' + msg + '</span>';
    document.body.appendChild(toast);
    setTimeout(function() { toast.remove(); }, 3000);
  }

  function formatPrice(p) {
    return parseFloat(p).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₽';
  }

  function scrollToRecord(id) {
    var index = -1;
    for (var i = 0; i < services.length; i++) {
      if (services[i].id === id) {
        index = i;
        break;
      }
    }

    if (index === -1) return false;

    highlightId = id;
    currentPage = Math.floor(index / pageSize) + 1;

    renderTable();
    renderPagination();

    setTimeout(function() {
      var row = document.querySelector('tr[data-id="' + id + '"]');
      if (row) {
        row.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }, 100);

    setTimeout(function() {
      highlightId = null;
    }, 3000);

    return true;
  }

  // === DATA ===
  function loadData() {
    var search = document.getElementById('filter-search').value;
    var medCenter = document.getElementById('filter-medcenter').value;

    var url = API_URL + '?sortBy=' + sortField + '&sortOrder=' + sortOrder;
    if (currentPageSlug) url += '&pageSlug=' + encodeURIComponent(currentPageSlug);
    if (search) url += '&search=' + encodeURIComponent(search);
    if (medCenter) url += '&medCenter=' + encodeURIComponent(medCenter);

    fetchAPI(url).then(function(data) {
      services = data;
      if (currentPage > Math.ceil(services.length / pageSize)) {
        currentPage = 1;
      }
      renderTable();
      renderPagination();
    }).catch(function(e) {
      document.getElementById('srv-table-body').innerHTML = '<tr><td colspan="6" class="srv-empty">Ошибка загрузки данных</td></tr>';
      showToast('Ошибка: ' + e.message, 'error');
    });
  }

  function loadMedcenters() {
    var url = API_URL + '/medcenters';
    if (currentPageSlug) url += '?pageSlug=' + encodeURIComponent(currentPageSlug);

    fetchAPI(url).then(function(centers) {
      medcenters = centers;
      var select = document.getElementById('filter-medcenter');
      centers.forEach(function(c) {
        var opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        select.appendChild(opt);
      });
    });
  }

  function renderTable() {
    var tb = document.getElementById('srv-table-body');
    if (!services.length) {
      tb.innerHTML = '<tr><td colspan="6" class="srv-empty">Нет данных</td></tr>';
      document.getElementById('srv-pagination').style.display = 'none';
      return;
    }

    document.getElementById('srv-pagination').style.display = 'flex';

    var start = (currentPage - 1) * pageSize;
    var end = Math.min(start + pageSize, services.length);
    var pageData = services.slice(start, end);

    tb.innerHTML = services.map(function(s, index) {
      var isHighlighted = highlightId && s.id === highlightId;
      var isOnCurrentPage = index >= start && index < end;
      var displayStyle = isOnCurrentPage ? '' : ' style="display:none"';

      return '<tr data-id="' + s.id + '"' + (isHighlighted ? ' data-highlighted="true"' : '') + displayStyle + ' class="srv-table-row">' +
        '<td class="center"><span class="srv-medcenter" data-center="' + s.medCenter + '" style="background:' + centerTone(s.medCenter).bg + ';color:' + centerTone(s.medCenter).fg + '">' + s.medCenter + '</span></td>' +
        '<td class="center">' + (s.serviceCode || '-') + '</td>' +
        '<td>' + s.serviceName + '</td>' +
        '<td class="center srv-price">' + formatPrice(s.price) + '</td>' +
        '<td><span class="srv-comment" title="' + (s.comment || '') + '">' + (s.comment || '-') + '</span></td>' +
        '<td class="center">' +
          '<div class="srv-actions">' +
            (canEditServices ? '<button class="srv-action-btn edit" onclick="servicesApp.openEditModal(\'' + s.id + '\')" title="Редактировать">' +
              '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>' +
            '</button>' : '') +
            (canEditServices ? '<button class="srv-action-btn delete" onclick="servicesApp.deleteRecord(\'' + s.id + '\')" title="Удалить">' +
              '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>' +
            '</button>' : '') +
          '</div>' +
        '</td>' +
      '</tr>';
    }).join('');

    document.getElementById('pagination-info').textContent =
      'Показано ' + (start + 1) + '–' + end + ' из ' + services.length;
  }

  function renderPagination() {
    var totalPages = Math.ceil(services.length / pageSize) || 1;
    var controls = document.getElementById('pagination-controls');

    var html = '<button class="srv-pagination-btn" onclick="servicesApp.goToPage(' + (currentPage - 1) + ')" ' + (currentPage === 1 ? 'disabled' : '') + '>' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>';

    var startPage = Math.max(1, currentPage - 2);
    var endPage = Math.min(totalPages, startPage + 4);
    if (endPage - startPage < 4) startPage = Math.max(1, endPage - 4);

    if (startPage > 1) {
      html += '<button class="srv-pagination-btn" onclick="servicesApp.goToPage(1)">1</button>';
      if (startPage > 2) html += '<span style="color:#9ca3af;padding:0 4px;">...</span>';
    }

    for (var i = startPage; i <= endPage; i++) {
      html += '<button class="srv-pagination-btn' + (i === currentPage ? ' active' : '') + '" onclick="servicesApp.goToPage(' + i + ')">' + i + '</button>';
    }

    if (endPage < totalPages) {
      if (endPage < totalPages - 1) html += '<span style="color:#9ca3af;padding:0 4px;">...</span>';
      html += '<button class="srv-pagination-btn" onclick="servicesApp.goToPage(' + totalPages + ')">' + totalPages + '</button>';
    }

    html += '<button class="srv-pagination-btn" onclick="servicesApp.goToPage(' + (currentPage + 1) + ')" ' + (currentPage === totalPages ? 'disabled' : '') + '>' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>';

    controls.innerHTML = html;
  }

  function goToPage(p) {
    var totalPages = Math.ceil(services.length / pageSize) || 1;
    if (p < 1 || p > totalPages) return;
    currentPage = p;
    highlightId = null;
    renderTable();
    renderPagination();
    document.querySelector('.srv-table-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // === МОДАЛКА ===
  function openAddModal() {
    document.getElementById('modal-title').textContent = 'Добавить услугу';
    document.getElementById('srv-form').reset();
    document.getElementById('edit-id').value = '';
    document.getElementById('edit-pageslug').value = currentPageSlug;
    document.getElementById('edit-misserviceid').value = '';
    document.getElementById('mis-search-section').style.display = 'block';
    document.getElementById('mis-results').style.display = 'none';
    document.getElementById('srv-modal').style.display = 'flex';
  }

  function openEditModal(id) {
    var item = services.find(function(s) { return s.id === id; });
    if (!item) return;

    document.getElementById('modal-title').textContent = 'Редактировать услугу';
    document.getElementById('edit-id').value = item.id;
    document.getElementById('edit-pageslug').value = item.pageSlug;
    document.getElementById('edit-medcenter').value = item.medCenter;
    document.getElementById('edit-servicecode').value = item.serviceCode;
    document.getElementById('edit-servicename').value = item.serviceName;
    document.getElementById('edit-price').value = item.price;
    document.getElementById('edit-preplink').value = item.preparationLink || '';
    document.getElementById('edit-comment').value = item.comment || '';
    document.getElementById('edit-misserviceid').value = item.misServiceId || '';

    document.getElementById('mis-search-section').style.display = 'none';
    document.getElementById('srv-modal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('srv-modal').style.display = 'none';
  }

  function saveRecord(e) {
    e.preventDefault();
    var id = document.getElementById('edit-id').value;
    var data = {
      pageSlug: document.getElementById('edit-pageslug').value || currentPageSlug,
      medCenter: document.getElementById('edit-medcenter').value,
      serviceCode: document.getElementById('edit-servicecode').value,
      serviceName: document.getElementById('edit-servicename').value,
      price: parseFloat(document.getElementById('edit-price').value),
      preparationLink: document.getElementById('edit-preplink').value,
      comment: document.getElementById('edit-comment').value,
      misServiceId: document.getElementById('edit-misserviceid').value || null
    };

    var url = id ? API_URL + '/' + id : API_URL;
    fetchAPI(url, { method: id ? 'PUT' : 'POST', body: JSON.stringify(data) })
      .then(function() {
        showToast(id ? 'Обновлено' : 'Добавлено', 'success');
        closeModal();
        loadData();
      }).catch(function(e) { showToast('Ошибка: ' + e.message, 'error'); });
  }

  function deleteRecord(id) {
    if (!confirm('Удалить услугу?')) return;
    fetchAPI(API_URL + '/' + id, { method: 'DELETE' })
      .then(function() {
        showToast('Удалено', 'success');
        loadData();
      }).catch(function(e) { showToast('Ошибка: ' + e.message, 'error'); });
  }

  // === ПОИСК В МИС ===
  function searchMIS() {
    var term = document.getElementById('mis-search-input').value;
    if (!term || term.length < 2) {
      showToast('Минимум 2 символа для поиска', 'error');
      return;
    }

    var resultsDiv = document.getElementById('mis-results');
    resultsDiv.style.display = 'block';
    resultsDiv.innerHTML = '<div class="srv-mis-empty">Поиск...</div>';

    var selectedCenter = document.getElementById('edit-medcenter').value;
    var clinicId = MEDCENTER_CLINIC_IDS[selectedCenter] || null;
    var searchBody = { term: term };
    if (clinicId) searchBody.clinic_id = clinicId;

    fetchAPI(MIS_URL + '/search-mis', {
      method: 'POST',
      body: JSON.stringify(searchBody)
    })
    .then(function(res) {
      if (!res.success || !res.data || res.data.length === 0) {
        resultsDiv.innerHTML = '<div class="srv-mis-empty">Ничего не найдено</div>';
        return;
      }

      resultsDiv.innerHTML = res.data.map(function(s) {
        return '<div class="srv-mis-result" onclick="servicesApp.selectMISService(' +
          "'" + (s.service_id || '') + "'," +
          "'" + (s.code || '').replace(/'/g, "\\'") + "'," +
          "'" + (s.title || '').replace(/'/g, "\\'") + "'," +
          s.price +
        ')">' +
          '<div class="srv-mis-result-title">' + s.title + '</div>' +
          '<div class="srv-mis-result-meta">' +
            'Код: ' + (s.code || '-') + ' | ' +
            '<span class="srv-mis-result-price">' + formatPrice(s.price) + '</span>' +
            (s.category ? ' | ' + s.category : '') +
          '</div>' +
        '</div>';
      }).join('');
    })
    .catch(function(e) {
      resultsDiv.innerHTML = '<div class="srv-mis-empty">Ошибка поиска</div>';
      showToast('Ошибка: ' + e.message, 'error');
    });
  }

  function onModalMedcenterChange() {
    var selectedCenter = document.getElementById('edit-medcenter').value;
    var clinicId = MEDCENTER_CLINIC_IDS[selectedCenter] || null;
    var misServiceId = document.getElementById('edit-misserviceid').value;

    // Если уже выбрана услуга из МИС — обновляем цену для нового медцентра
    if (misServiceId && clinicId) {
      var MIS_PROXY_URL = (window.location.port === '9000' ? window.location.protocol + '//' + window.location.hostname + ':9001' : window.location.origin) + '/api/mis/services';
      fetchAPI(MIS_PROXY_URL, {
        method: 'POST',
        body: JSON.stringify({ service_ids: [misServiceId], clinic_id: clinicId })
      }).then(function(res) {
        var list = (res && res.data) ? res.data : [];
        var svc = list.find(function(s) { return String(s.service_id) === String(misServiceId); });
        if (svc && svc.price !== undefined && parseFloat(svc.price) > 0) {
          document.getElementById('edit-price').value = parseFloat(svc.price);
          showToast('Цена обновлена для медцентра ' + selectedCenter, 'success');
        }
      }).catch(function() {});
      return;
    }

    // Иначе — обновляем результаты поиска, если они показаны
    var term = document.getElementById('mis-search-input').value;
    var resultsDiv = document.getElementById('mis-results');
    if (term && term.length >= 2 && resultsDiv.style.display !== 'none') {
      searchMIS();
    }
  }

  function selectMISService(serviceId, code, title, price) {
    document.getElementById('edit-servicecode').value = code;
    document.getElementById('edit-servicename').value = title;
    document.getElementById('edit-price').value = price;
    document.getElementById('edit-misserviceid').value = serviceId;
    document.getElementById('mis-results').style.display = 'none';
    showToast('Данные из МИС загружены', 'success');
  }

  // === ЗАМЕТКИ ===
  var notesData = null;

  function loadNotes() {
    if (!currentPageSlug) return;
    fetchAPI(API_URL + '/notes?pageSlug=' + encodeURIComponent(currentPageSlug))
      .then(function(data) {
        notesData = data.notes;
        renderNotes();
      }).catch(function() {});
  }

  function renderNotes() {
    var block = document.getElementById('srv-notes-block');
    var viewEl = document.getElementById('srv-notes-view');
    var editBtn = document.getElementById('srv-notes-edit-btn');
    var addHint = document.getElementById('srv-notes-add-hint');

    var hasContent = notesData && notesData.trim();

    if (hasContent) {
      block.style.display = '';
      viewEl.innerHTML = notesData;
      viewEl.style.display = '';
      addHint.style.display = 'none';
    } else if (canEditServices) {
      block.style.display = '';
      viewEl.style.display = 'none';
      addHint.style.display = '';
    } else {
      block.style.display = 'none';
      return;
    }

    if (canEditServices) {
      editBtn.style.display = hasContent ? 'flex' : 'none';
    }
  }

  function startEditNotes() {
    var editor = document.getElementById('srv-notes-editor');
    var editWrap = document.getElementById('srv-notes-edit-wrap');
    var viewEl = document.getElementById('srv-notes-view');
    var editBtn = document.getElementById('srv-notes-edit-btn');
    var addHint = document.getElementById('srv-notes-add-hint');

    editor.innerHTML = notesData || '';
    editWrap.style.display = '';
    viewEl.style.display = 'none';
    editBtn.style.display = 'none';
    addHint.style.display = 'none';
    setTimeout(function() { editor.focus(); }, 0);
  }

  function cancelEditNotes() {
    document.getElementById('srv-notes-edit-wrap').style.display = 'none';
    renderNotes();
  }

  function saveNotes() {
    var editor = document.getElementById('srv-notes-editor');
    var html = editor.innerHTML.trim();
    if (html === '<br>') html = '';

    fetchAPI(API_URL + '/notes', {
      method: 'PUT',
      body: JSON.stringify({ pageSlug: currentPageSlug, notes: html || null })
    }).then(function() {
      notesData = html || null;
      document.getElementById('srv-notes-edit-wrap').style.display = 'none';
      renderNotes();
      showToast('Заметки сохранены', 'success');
    }).catch(function(e) { showToast('Ошибка: ' + e.message, 'error'); });
  }

  // === ДЕЙСТВИЯ ===
  function sortTable(field) {
    var ths = document.querySelectorAll('.srv-table th');
    ths.forEach(function(th) { th.classList.remove('sorted'); });

    if (sortField === field) {
      sortOrder = sortOrder === 'ASC' ? 'DESC' : 'ASC';
    } else {
      sortField = field;
      sortOrder = 'ASC';
    }

    currentPage = 1;
    loadData();

    var th = document.querySelector('.srv-table th.sortable[onclick*="' + field + '"]');
    if (th) th.classList.add('sorted');
  }

  function debounceLoad() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(function() {
      currentPage = 1;
      loadData();
    }, 300);
  }

  function resetAndLoad() {
    currentPage = 1;
    loadData();
  }

  // Только филиалы с числовым clinic_id: по нему модуль тянет цены из МИС,
  // и медцентр без него в этом списке бесполезен.
  function loadMedCenterRegistry() {
    var base = (window.location.port === '9000'
      ? window.location.protocol + '//' + window.location.hostname + ':9001'
      : window.location.origin);
    return fetchAPI(base + '/api/med-centers').then(function(list) {
      MEDCENTER_CLINIC_IDS = {};
      var sel = document.getElementById('edit-medcenter');
      // Через DOM, а не сборкой HTML-строки: своей функции экранирования в этом
      // файле нет, а название медцентра теперь редактируется в админке.
      if (sel) sel.innerHTML = '<option value="">Выберите...</option>';
      (list || []).forEach(function(mc) {
        var raw = (mc.misClinicIds || [])[0];
        if (!/^\d+$/.test(String(raw))) return;
        MEDCENTER_CLINIC_IDS[mc.name] = Number(raw);
        MEDCENTER_COLORS[mc.name] = mc.color || '';
        if (!sel) return;
        var opt = document.createElement('option');
        opt.value = mc.name;
        opt.textContent = mc.name;
        sel.appendChild(opt);
      });
      // Справочник и данные грузятся параллельно: если таблица успела
      // отрисоваться раньше, перекрашиваем бейджи уже приехавшими цветами.
      if (services.length) renderTable();
    }).catch(function(err) {
      console.error('Не удалось загрузить справочник медцентров:', err);
    });
  }

  // === INIT ===
  if (!getToken()) {
    document.getElementById('services-app').innerHTML = '<div style="padding:40px;text-align:center;color:#dc2626;">Необходима авторизация</div>';
  } else {
    initPageSlug();
    loadMedCenterRegistry();

    var urlParams = new URLSearchParams(window.location.search);
    var highlightParam = urlParams.get('highlight');

    // Загружаем права пользователя
    fetch((window.location.port === '9000' ? window.location.protocol + '//' + window.location.hostname + ':9001' : window.location.origin) + '/api/auth/me', {
      headers: { 'Authorization': 'Bearer ' + getToken() }
    }).then(function(r) { return r.json(); }).then(function(me) {
      canEditServices = !!(me.isAdmin || me.canEditServices);
      if (canEditServices) {
        var addBtn = document.getElementById('srv-add-btn');
        if (addBtn) addBtn.style.display = '';
      }
    }).catch(function() {}).finally(function() {
      loadData();
      loadMedcenters();
      loadNotes();
    });

    if (highlightParam) {
      var checkAndScroll = setInterval(function() {
        if (services.length > 0) {
          clearInterval(checkAndScroll);
          scrollToRecord(highlightParam);
          window.history.replaceState({}, '', window.location.pathname);
        }
      }, 100);
      setTimeout(function() { clearInterval(checkAndScroll); }, 5000);
    }

    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });
  }

  return {
    loadData: loadData,
    openAddModal: openAddModal,
    openEditModal: openEditModal,
    closeModal: closeModal,
    saveRecord: saveRecord,
    deleteRecord: deleteRecord,
    sortTable: sortTable,
    debounceLoad: debounceLoad,
    resetAndLoad: resetAndLoad,
    goToPage: goToPage,
    scrollToRecord: scrollToRecord,
    searchMIS: searchMIS,
    selectMISService: selectMISService,
    onModalMedcenterChange: onModalMedcenterChange,
    startEditNotes: startEditNotes,
    cancelEditNotes: cancelEditNotes,
    saveNotes: saveNotes
  };
})();
</script>

</body>
</html>
