        // Если нет клиник - делаем один запрос без clinic_id
        if (modalClinicIds.length === 0) {
          return fetchAPI(API_BASE + '/mis/services', {
            method: 'POST',
            body: JSON.stringify({ service_ids: serviceIds })
          }).then(function(servData) {
            return { clinicResults: [{ clinicId: null, data: servData }] };
          });
        }

        // Делаем параллельные запросы для КАЖДОЙ клиники
        var promises = modalClinicIds.map(function(clinicId) {
          return fetchAPI(API_BASE + '/mis/services', {
            method: 'POST',
            body: JSON.stringify({ service_ids: serviceIds, clinic_id: clinicId })
          }).then(function(servData) {
            return { clinicId: clinicId, data: servData };
          });
        });

        return Promise.all(promises).then(function(results) {
          return { clinicResults: results };
        });
      }
      throw new Error('Нет услуг');
    }).then(function(result) {
      var clinicResults = result.clinicResults;

      // Собираем услуги со всеми ценами по клиникам
      var servicesMap = {}; // serviceId -> { service, prices: { clinicId: price } }
      var servicesOrder = []; // порядок вставки (Object.keys сортирует числовые ключи по возрастанию, теряя порядок МИС)

      console.log('🔍 clinicResults:', clinicResults);

      clinicResults.forEach(function(cr) {
        console.log('🔍 Processing clinic result:', cr);
        if (cr.data && cr.data.error === 0 && cr.data.data) {
          var services = Array.isArray(cr.data.data) ? cr.data.data : [cr.data.data];
          console.log('🔍 Services for clinic', cr.clinicId, ':', services);
          services.forEach(function(s) {
            var serviceId = s.service_id || s.id;
            if (!servicesMap[serviceId]) {
              servicesMap[serviceId] = {
                service: s,
                prices: {}
              };
              servicesOrder.push(String(serviceId));
            }
            // Сохраняем цену для этой клиники
            if (cr.clinicId !== null) {
              servicesMap[serviceId].prices[cr.clinicId] = parseFloat(s.price) || 0;
            } else {
              servicesMap[serviceId].prices['default'] = parseFloat(s.price) || 0;
            }
          });
        }
      });

      var servicesList = servicesOrder.map(function(id) {
        return servicesMap[id];
      });

      if (servicesList.length === 0) {
        throw new Error('Не удалось загрузить услуги');
      }

      modalServices = servicesList.map(function(item, idx) {
        var serviceId = item.service.service_id || item.service.id;
        var override = serviceOverrides[serviceId] || {};
        return {
          id: serviceId,
          code: item.service.code || item.service.sub_code || '',
          title: item.service.title || '',
          duration: item.service.duration || '',
          prices: item.prices,  // Теперь хранит цены по клиникам
          aliasName: override.aliasName || '',
          aliasDuration: override.aliasDuration || '',
          isHidden: override.isHidden || false,
          isFavorite: override.isFavorite || false,
          sortOrder: override.sortOrder !== undefined ? override.sortOrder : (10000 + idx)
        };
      });

      // Sort by sortOrder
      modalServices.sort(function(a, b) { return a.sortOrder - b.sortOrder; });

      renderModalServices();
    }).catch(function(e) {
      console.error('Load modal services error:', e);
      document.getElementById('modal-services-loading').style.display = 'none';
      document.getElementById('modal-services-empty').style.display = 'block';
    });
  }

  // Форматирование цен с указанием клиник
  function formatServicePrices(prices) {
    if (!prices) return '—';
    var priceKeys = Object.keys(prices);
    if (priceKeys.length === 0) return '—';

    // Если одна цена без привязки к клинике
    if (priceKeys.length === 1 && priceKeys[0] === 'default') {
      return prices['default'] ? Number(prices['default']).toLocaleString('ru-RU') + ' ₽' : '—';
    }

    // Если одна клиника - показываем цену без названия
    if (modalClinicIds.length === 1) {
      var singlePrice = prices[modalClinicIds[0]];
      return singlePrice && singlePrice > 0 ? Number(singlePrice).toLocaleString('ru-RU') + ' ₽' : '—';
    }

    // Несколько клиник - показываем все цены с названиями
    var pricesParts = [];
    modalClinicIds.forEach(function(cid) {
      if (prices[cid] !== undefined && prices[cid] > 0) {
        var shortName = CLINIC_SHORT_NAMES[cid] || cid;
        pricesParts.push(Number(prices[cid]).toLocaleString('ru-RU') + ' (' + shortName + ')');
      }
    });
    return pricesParts.length > 0 ? pricesParts.join(', ') : '—';
  }

  function renderModalServices() {
    var container = document.getElementById('modal-services-list');
    if (!container || modalServices.length === 0) {
      document.getElementById('modal-services-loading').style.display = 'none';
      document.getElementById('modal-services-empty').style.display = 'block';
      document.getElementById('services-header').style.display = 'none';
      return;
    }

    var html = modalServices.map(function(service, index) {
      var hiddenClass = service.isHidden ? ' hidden' : '';
      return '<div class="dc-service-item' + hiddenClass + '" draggable="true" data-index="' + index + '">' +
        '<div class="dc-service-drag-handle" title="Перетащите для изменения порядка">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
            '<line x1="4" y1="8" x2="20" y2="8"/><line x1="4" y1="16" x2="20" y2="16"/>' +
          '</svg>' +
        '</div>' +
        '<div class="dc-service-content">' +
          '<div class="dc-service-header">' +
            '<span class="dc-service-code">' + escapeHtml(service.code) + '</span>' +
            '<div class="dc-service-original-title">' + escapeHtml(service.title) + '</div>' +
          '</div>' +
          '<div class="dc-service-fields">' +
            '<div class="dc-service-field">' +
              '<label class="dc-service-field-label">' +
                '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">' +
                  '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>' +
                  '<path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>' +
                '</svg>' +
                'Псевдоним названия' +
              '</label>' +
              '<input type="text" class="dc-service-name-input" placeholder="Оставьте пустым для оригинального названия" ' +
                'value="' + escapeHtml(service.aliasName) + '" ' +
                'oninput="dcApp.updateServiceAlias(' + index + ', \'name\', this.value)">' +
            '</div>' +
            '<div class="dc-service-field">' +
              '<label class="dc-service-field-label">' +
                '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">' +
                  '<circle cx="12" cy="12" r="10"/>' +
                  '<polyline points="12 6 12 12 16 14"/>' +
                '</svg>' +
                'Длительность' +
              '</label>' +
              '<input type="text" class="dc-service-duration-input" placeholder="' + (service.duration ? 'Сейчас: ' + service.duration : 'Не указана') + '" ' +
                'value="' + escapeHtml(service.aliasDuration) + '" ' +
                'oninput="dcApp.updateServiceAlias(' + index + ', \'duration\', this.value)">' +
            '</div>' +
          '</div>' +
          '<div class="dc-service-meta">' +
            'Цена: <strong>' + formatServicePrices(service.prices) + '</strong>' +
          '</div>' +
        '</div>' +
        '<div class="dc-service-actions">' +
          '<button type="button" class="dc-service-btn dc-service-btn-favorite' + (service.isFavorite ? ' active' : '') + '" ' +
            'onclick="dcApp.toggleServiceFavorite(' + index + ')" title="' + (service.isFavorite ? 'Убрать из избранного' : 'Добавить в избранное') + '">' +
            '<svg viewBox="0 0 24 24" fill="' + (service.isFavorite ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="2">' +
              '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>' +
            '</svg>' +
          '</button>' +
          '<button type="button" class="dc-service-btn dc-service-btn-visibility' + (service.isHidden ? ' hidden' : '') + '" ' +
            'onclick="dcApp.toggleServiceVisibility(' + index + ')" title="' + (service.isHidden ? 'Показать услугу' : 'Скрыть услугу') + '">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
              (service.isHidden ?
                '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>' :
                '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>') +
            '</svg>' +
          '</button>' +
        '</div>' +
      '</div>';
    }).join('');

    container.innerHTML = html;
    document.getElementById('modal-services-loading').style.display = 'none';
    document.getElementById('modal-services-empty').style.display = 'none';
    container.style.display = 'block';

    // Show header
    document.getElementById('services-header').style.display = 'block';

    // Update counter
    var visibleCount = modalServices.filter(function(s) { return !s.isHidden; }).length;
    document.getElementById('services-counter').textContent = visibleCount + ' из ' + modalServices.length;

    // Attach drag-n-drop event listeners
    container.querySelectorAll('.dc-service-item').forEach(function(item) {
      item.addEventListener('dragstart', handleDragStart);
      item.addEventListener('dragover', handleDragOver);
      item.addEventListener('drop', handleDrop);
      item.addEventListener('dragend', handleDragEnd);
      item.addEventListener('dragleave', handleDragLeave);
    });
  }

  function updateServiceAlias(index, field, value) {
    if (!modalServices[index]) return;

    if (field === 'name') {
      modalServices[index].aliasName = value;
    } else if (field === 'duration') {
      // If value is just a number, automatically add " минут"
      var trimmed = value.trim();
      if (trimmed && /^\d+$/.test(trimmed)) {
        modalServices[index].aliasDuration = trimmed + ' минут';
      } else {
        modalServices[index].aliasDuration = value;
      }
    }
  }

  function toggleServiceVisibility(index) {
    if (!modalServices[index]) return;

    modalServices[index].isHidden = !modalServices[index].isHidden;
    renderModalServices();
  }

  function toggleServiceFavorite(index) {
    if (!modalServices[index]) return;

    modalServices[index].isFavorite = !modalServices[index].isFavorite;
    renderModalServices();
  }

  function handleDragStart(e) {
    var index = parseInt(e.currentTarget.getAttribute('data-index'));
    draggedServiceIndex = index;
    e.currentTarget.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  }

  function handleDragOver(e) {
    if (e.preventDefault) e.preventDefault();
    e.dataTransfer.dropEffect = 'move';

    // Add visual feedback
    var target = e.currentTarget;
    if (target && !target.classList.contains('dragging')) {
      target.classList.add('drag-over');
    }

    return false;
  }

  function handleDragLeave(e) {
    // Remove visual feedback when dragging away
    var target = e.currentTarget;
    if (target) {
      target.classList.remove('drag-over');
    }
  }

  function handleDrop(e) {
    if (e.stopPropagation) e.stopPropagation();
    if (e.preventDefault) e.preventDefault();

    // Remove visual feedback
    e.currentTarget.classList.remove('drag-over');

    var dropIndex = parseInt(e.currentTarget.getAttribute('data-index'));

    if (draggedServiceIndex !== null && draggedServiceIndex !== dropIndex) {
      var draggedItem = modalServices[draggedServiceIndex];
      modalServices.splice(draggedServiceIndex, 1);
      modalServices.splice(dropIndex, 0, draggedItem);

      // Update sortOrder
      modalServices.forEach(function(s, i) { s.sortOrder = i; });

      renderModalServices();
    }

    return false;
  }

  function handleDragEnd(e) {
    e.currentTarget.classList.remove('dragging');
    draggedServiceIndex = null;

    // Clean up any lingering drag-over classes
    document.querySelectorAll('.dc-service-item.drag-over').forEach(function(item) {
      item.classList.remove('drag-over');
    });
  }

  function saveCard(e) {
    e.preventDefault();
    var id = getValue('edit-id');
    var tagsInput = getValue('edit-tags');
    var tags = parseTags(tagsInput);

    // Prepare service overrides (only if services were loaded)
    var metadata = {};

    if (modalServices.length > 0) {
      // Services tab was opened, save the overrides
      var preparedOverrides = {};
      modalServices.forEach(function(service, idx) {
        var override = {
          aliasName: service.aliasName || '',
          aliasDuration: service.aliasDuration || '',
          isHidden: service.isHidden || false,
          isFavorite: service.isFavorite || false,
          sortOrder: idx
        };
        // Для избранных услуг сохраняем полные данные для мгновенного отображения
        if (service.isFavorite) {
          override.title = service.title || '';
          override.code = service.code || '';
          override.duration = service.duration || '';
          override.prices = service.prices || {};
        }
        preparedOverrides[service.id] = override;
      });
      metadata.serviceOverrides = preparedOverrides;
    } else if (id) {
      // Services tab was not opened, preserve existing overrides
      var existingCard = cards.find(function(c) { return c.id === id; });
      if (existingCard && existingCard.metadata && existingCard.metadata.serviceOverrides) {
        metadata.serviceOverrides = existingCard.metadata.serviceOverrides;
      }
    }

    var data = {
      pageSlug: PAGE_SLUG,
      fullName: getValue('edit-fullname'),
      specialty: getValue('edit-specialty'),
      experience: getValue('edit-experience'),
      profileUrl: getValue('edit-profile-url'),
      description: getEditorContent(),
      misUserId: getValue('edit-mis-user-id') || null,
      ageRange: getValue('edit-age-range'),
      internalNumber: getValue('edit-internal'),
      mobileNumber: getValue('edit-mobile'),
      clinics: convertNewClinicIdsToOld(getSelectedClinics()),
      tags: tags,
      metadata: metadata
    };

    var url = id ? API_BASE + '/doctor-cards/' + id : API_BASE + '/doctor-cards';
    fetchAPI(url, { method: id ? 'PUT' : 'POST', body: JSON.stringify(data) })
      .then(function() {
        showToast(id ? 'Карточка обновлена' : 'Врач добавлен', 'success');
        closeModal();
        loadCards();
      })
      .catch(function(e) { showToast('Ошибка: ' + e.message, 'error'); });
  }

  function deleteCard(id) {
    if (!confirm('Удалить карточку врача?')) return;
    fetchAPI(API_BASE + '/doctor-cards/' + id, { method: 'DELETE' })
      .then(function() {
        showToast('Карточка удалена', 'success');
        loadCards();
      })
      .catch(function(e) { showToast('Ошибка: ' + e.message, 'error'); });
  }

  // ═══════════════════════════════════════════════════════════════
  // INIT
  // ═══════════════════════════════════════════════════════════════

  function init() {
    var params = new URLSearchParams(window.location.search);
    highlightId = params.get('highlight');
    // Сначала загружаем данные пользователя, потом карточки
    loadCurrentUser().then(function() {
      loadCards();
    }).catch(function(err) {
      console.error('Init error:', err);
      loadCards(); // Загружаем карточки даже при ошибке
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  return {
    loadCards: loadCards,
    filterCards: filterCards,
    debounceFilter: debounceFilter,
    switchTab: switchTab,
    toggleNotes: toggleNotes,
    openAddModal: openAddModal,
    openEditModal: openEditModal,
    closeModal: closeModal,
    saveCard: saveCard,
    deleteCard: deleteCard,
    searchMIS: searchMIS,
    selectDoctor: selectDoctor,
    formatPhone: formatPhone,
    loadDaySchedule: loadDaySchedule,
    backToCalendar: backToCalendar,
    switchModalTab: switchModalTab,
    updateServiceAlias: updateServiceAlias,
    toggleServiceVisibility: toggleServiceVisibility,
    toggleServiceFavorite: toggleServiceFavorite
  };
})();
</script>
</body>
</html>
